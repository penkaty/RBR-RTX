# RTX Remix bridge settings for RBR-RTX. Remix's bridge reads .trex\bridge.conf next to its own d3d9.dll.

# The comp layer in our d3d9 proxy uses the Remix API for the sun light (src\d3d9-proxy\comp.cpp).
exposeRemixApi = True

# Skip setter calls that write the value the bridge already holds (RBR re-sets the same states and constants often; the
# proxy adds its own per-draw sets). GTA4-rtx ships it on. K A/B 2026-10-17: no frame-time change (GPU-bound), kept for
# less bridge traffic.
eliminateRedundantSetterCalls = True

# Bigger client->server buffers (defaults 96MB/32MB, 3000 queue items). Loading a stage for the first time (new
# textures) twice hung the game with "Data Queue overwrite condition triggered / Waiting on server" (15 Oct stage
# exit, 17 Oct Jodlownik load). Values = xoxor4d's remix-comp _general; RBR_SSE is large-address-aware, so it fits.
clientChannelMemSize = 192MB
serverChannelMemSize = 64MB
clientCmdQueueSize = 10000
clientDataQueueSize = 10000

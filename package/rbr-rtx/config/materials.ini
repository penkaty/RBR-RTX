; RBR-RTX materials made by the add-on itself (2026-10-30). They go into a Remix mod it writes and keeps up to date:
; rbr-rtx\rtx-remix\mods\rbr_rtx_lit\mod.usda (Remix reloads it while you play when it changes). Nothing is copied
; from the game: the materials point at your own files. Read when the game starts: change a value, restart the game.

[lit_parts]
; RBR shows lit parts as separate meshes: the orange "hot" brake discs and the lit brake lamp lenses while you brake,
; the lit head and tail lamp lenses while the lamps are on, the reverse lamp in reverse. Under path tracing they were
; only orange or white paint. The add-on learns which car parts the game swaps in when the brake / lamps / reverse
; switch on (the log says "lit part"; the lamps are learnt at the start of each stage), and from then on they glow.
; The brake lamp lens the game shows while not braking glows as a tail lamp while the lamps are on (tail_glow).
; 0 = off
enable = 1
; 2026-11-09: emissive is in scene light units and night exposure multiplies it many times, so values above about 0.3 clip to white.
; glow strength (Remix emissive intensity) of each kind; 0 = that kind does not glow. Lamp lenses 75 % dimmer since
; 2026-11-01 (user). The brake discs have a heat model instead, see below.
brake_glow = 0.35
lamp_glow = 0.08
reverse_glow = 0.25
; the brake lamp lens while the lamps are on and you do not brake (a tail lamp: dimmer than the brake light)
; 2026-11-12 (user): as bright to the eye as the head lamps; a red lens gives off far less than a white one at the same value.
tail_glow = 0.2

; Brake discs (user 2026-11-02: they lit too often, kept their warmth between brakings and started far too bright and blue).
; Each disc has a heat: braking heats it (brake pedal x speed), it cools down with time and faster at speed (air). It glows
; only above brake_disc_glow_start, dull red first, orange at full heat; the glow follows the heat in 6 steps.
; Heat per second at full brake and 100 km/h. A short braking adds little; roughly 10 s of hard braking at 100 km/h
; (or several hairpins in a row) reaches the start
brake_disc_heat_rate = 0.04
; cooling time constant: standing, the heat falls to 37 % in this many seconds (at 100 km/h twice as fast)
brake_disc_cool_seconds = 45
; heat at which the glow starts, and at which it is at full strength (brake_disc_glow)
brake_disc_glow_start = 0.35
brake_disc_glow_full = 1.0
; emissive intensity at full heat (was 12 with the old on/off glow: far too bright; 0 = discs never glow)
brake_disc_glow = 0.4

[foliage]
; Bent normals on foliage cards (RBR-RTX runtime only: our Remix Plus build with the CardNormals port; Remix 1.5.2 and
; stock Remix Plus ignore it). Sent as rtx.cardNormalsTextures: the catalog's cards (config\foliage-classes.txt) and the
; swaying textures learned on unknown stages (added in the menu only: a change rebuilds the instances). The lean toward
; straight up is Alt+X > Material Options > PBR Material Modifiers > Opaque > Card Normals Up Weight (rtx.cardNormals.upWeight, 0.5). 0 = off
card_normals = 1
; Drawn with the sway shader but no leaves (on stages the catalog does not know; foliage-classes.txt covers the rest):
; 04153DADDBE42CA1 = the main menu's wood / guardrail / rock / lamp-post atlas.
not_foliage = 04153DADDBE42CA1
; Leaves let light through (Remix's foliage model, "thin opaque"): trees and bushes lit from behind glow in their own
; colour, sunlit crowns get soft translucency instead of the flat, dark backs of RBR's crossed leaf cards. For the
; textures of swaying foliage (trees, bushes, grass) the add-on has seen; new ones are added a few seconds after they
; first show up. 0 = off (off since 2026-10-30 evening, user: trees looked unnaturally lit, cost unmeasured; OMM test first)
thin_opaque = 1
; how matte the leaves are: 1 = no shine at all, 0.5 = glossy (what they were until 2026-11-13: the cards caught every
; light and reflection and came out brighter than the game draws them)
roughness = 1
; leaf thickness in millimetres (0.001 .. 16): thinner = more light passes
thickness_mm = 0.5
; colour of the light through a leaf: each texture's own average colour, scaled so its brightest channel is
; scattering_brightest (0..1); scattering_albedo where that colour is not known. (Until 2026-10-30 the colour went
; into the transmittance: Remix then scatters the colours the leaf passes LEAST, so backlit trees came out purple.)
scattering_brightest = 0.5
scattering_albedo = 0.6, 0.75, 0.45
; how much light gets through unscattered, the same for red, green and blue (keep the three equal, or the leaves take
; the opposite colour); lower = more light scattered in the leaf colour, darker behind
transmittance = 0.5, 0.5, 0.5
; -1 .. 1: positive = light keeps going forward through the leaf (backlit leaves glow more)
anisotropy = 0.3

; Draws never made (comp.cpp load_skip_textures). 40AA313D3EE0E9B6 = the game's sun flare, a screen-space additive
; sprite at the sun (user 2026-11-01: it has to go; only ignored in Remix it showed as a square).
[skip_draws]
; 2B06468C18F57C43 = the flare's rings (user 2026-11-01, Zeran: still visible after the first one went).
; 660BCAB491C6BCCA = the glow sprite RBR draws around every lit lamp (Cars\*\textures\light.dds), 6608038483CA2560 = the
; BMW M3 E30's lamp glow sprite (user 2026-11-07: "dont use the floating fake light, light the lamp itself with emissives"):
; the lenses glow through [lit_parts] instead. Remove them here to get the sprites back.
textures = 40AA313D3EE0E9B6, 2B06468C18F57C43, 660BCAB491C6BCCA, 6608038483CA2560
; lens_flare = 1: the game's whole flare family is skipped structurally (screen-space additive textured draws, z off, after the sun's
; occlusion query / before the HUD): rings, glow, 32x32 sprites, the strip. 0 = draw them. Also on the F3 Debug page (Sun).
lens_flare = 1
; car_shadow = 0: the game's own car shadow (RichardBurnsRally.ini RenderCarShadow: stencil volumes and a darkening quad between the car
; draws) is not sent to Remix, whatever the game option says: path tracing shadows the car, and the quad made Remix rasterise the
; car (flat black, drawn over the scene). 1 = draw them.
car_shadow = 0

[game_windscreen]
; The game's own windscreen drops, streaks and wiper film (shown with ParticleQuality on in the game's graphics options) are
; drawn this many times stronger: 1 = as the game draws them, 2 (default) or 4.
gain = 2

; The world through the Remix API (apiworld.cpp, Remix Plus on Kim's runtime only; 1.5.2 and 2.0.0 ignore it): every
; static RL* scenery draw (ground, objects, foliage cards) is registered once as a retained instance on the game's own
; texture, and the game's draw of it is no longer sent through the bridge (CPU per frame). Mods, rtx.conf lists and
; CardNormals apply as before. Not taken: blended draws (decals, soft foliage edges), two-texture ground while the
; ground second layer (Alt+Y) is on, animated, car, sky, water, particles. Key api_world (Alt+W): all -> foliage only -> off, to compare.
[api_world]
; Off by default since run 20261101-130413: no fps gain (GPU bound) and every moving RL* draw (clock, marshals,
; flags) freezes or ghosts; the car breaks in the runtime with it on. Alt+W turns it on for experiments.
enabled = 0
static = 1
; Drivers and co-drivers (ObjPosNormalTexture near the car) as API meshes drawn every frame with their exact world
; matrix (user 2026-11-12); independent of enabled above. 0 = the game's D3D9 draws.
drivers = 1
foliage = 1
; 1 = every triangle shaded flat, as Remix shades fixed-function scenery today; 0 = smooth vertex normals.
flat_normals = 1
; Per frame at most this many new meshes / vertices are built (loading a new view does not hitch).
max_builds_per_frame = 64
max_vertices_per_frame = 60000
; An instance in view that the game has not drawn for this many frames is hidden (culled, LOD swap); 0 = never.
hide_frames = 30

[hud_glow]
; RBRHUD's in-car gauge displays glow as in the game (hudglow.cpp; needs our Kim runtime, -RemixPlusVersion rbrkim):
; lit = display x mask alpha always, + display x mask rgb while RBRHUD's "dynamic emissive elements" are on (dark stages).
; Off from run 20261101-130413 (the Fabia display washed out, E30 gauges black, switches lit) to 2026-11-05: on again
; with blended / alpha-tested layers left out (the E30 needle layer went solid) and the glow at
; rtx.fnvProtocol.glowEmissiveIntensity = 0.25 in rtx.conf (it was 1.0, the washout). Switches lit by the mask's alpha
; are RBRHUD's own look (its shader adds tex x mask.a by day too).
enabled = 1
; Glow tint, D3DCOLOR hex RRGGBB (FFFFFF = the display's own colours). Brightness: rtx.fnvProtocol.glowEmissiveIntensity.
tint = FFFFFF
; Texture stage the mask is also bound to for Remix (0-7; RBRHUD's shader does not sample it).
slot = 7
; Gauge layers (world-space UI): glow with the lamps on / off, rtx.worldSpaceUiEmissiveIntensity. Remix default 2.0 clips to white at night.
ui_emissive_lamps_on = 0.05
ui_emissive_lamps_off = 0
; Every emissive is multiplied by this by day (rtx.emissiveIntensity): 1 with the sun at or below emissive_gain_from_sun, this at or above
; emissive_gain_to_sun (degrees). The glow values above are tuned for the dark; raise this if lamps are too dim by day.
emissive_day_gain = 8
emissive_gain_from_sun = 0
emissive_gain_to_sun = 25
; 1 = Remix reads a copy of each gauge target taken at its car draw (needles and displays vanished while they updated).
snapshot = 1
[car_paint]
enable=1
shiny_roughness=0.240
dull_roughness=0.880
metallic=0.800
[glass]
; Car glass with stickers (2026-11-06): each glass draw (the rbr_car_glass mod's textures + textures below) is made twice
; with the same texture: texels with alpha >= sticker_ref solid and opaque (stickers, numbers), the rest blended at
; their own alpha as the game draws them (clear glass, semi-transparent stickers, sun visor gradient). RBRHUD's F4
; windscreen opacity applies in the cockpit: stickers it makes see-through fall into the blended part.
; split = 0: the game's single blended draw.
split = 1
sticker_ref = 240
; Alpha (0-255) added to the clear glass so it shows as glass: its tint and reflection are weighted by its alpha, and at
; the game's own alpha it is almost invisible. glass_alpha_add = seen from outside, glass_alpha_add_cabin = from the
; cockpit (keep it low: it hazes the view out). 0 = the game's alpha.
glass_alpha_add = 48
glass_alpha_add_cabin = 10
textures =

[surfaces]
; What each ground texture is, asked from the game's own physics (the surface under its triangles: tarmac, gravel,
; grass, dirt, snow, rock). It decides the texture's material class and whether rain may leave puddles on it.
; Learned as you play and kept in rtx-remix\mods\rbr_rtx_lit\surfaces.txt. 0 = off (textures keep their catalog class).
physics_probe = 1
; a class material (roughness, bumps) for every texture the probe has judged; 0 = wet lists only
class_materials = 1
; surfaces that may hold standing water. The rest of the ground still gets wet (darker, glossier), without puddles.
; Names: tarmac, gravel, dirt, grass, rough, rock, snow
puddle_surfaces = tarmac, gravel
; a texture counts as road when at least this share of it lies on those surfaces (road textures include their verge)
puddle_min_share = 0.5
; also judge the menu's background scene
probe_in_menu = 1
; Puddles by position: the add-on asks the physics where the road is on a grid around the car and tells the runtime, so
; water stands only there (a road texture includes its verge, and old stages draw all their ground from one texture).
; 0 = puddles wherever a wet-marked texture is flat. Grid: cells per side and their size in metres (160 x 1 m = 160 m).
road_mask = 1
road_mask_cells = 160
road_mask_cell_m = 1
; metres beside the road that may hold water too (ditches, verges); puddles fade out over the last couple of metres
road_vicinity_m = 5
; collision questions per frame while new cells scroll in (lower if the stage start stutters)
road_mask_queries_per_frame = 600

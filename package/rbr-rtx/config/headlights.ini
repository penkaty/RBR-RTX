; RBR-RTX headlights: the car's headlights as real (path-traced) lights. The headlights key (L, keys.ini) steps
; OFF -> ON (two lights at the car's own headlights) -> BRIGHTS (plus a tight high beam next to each lamp: four
; lights) -> OFF. They also come on by themselves when the sun is low (below auto_below_sun) and go off when it is
; high again; once you press the key on a stage, they stay as you set them until the next stage.
; This file is read again at the start of every stage: change a value, restart the stage, compare.

[headlights]
; 0 = no headlights at all (the key does nothing)
enable = 1
; sun height in degrees below which the lights switch on by themselves (none = never)
auto_below_sun = 10
; which mode the automatic switch uses: 2 = two lamps, 3 = brights (four lamps)
auto_mode = 2
; brightness (red, green, blue) of each lamp (2026-10-23, then -15 %; double all three numbers = twice as bright)
radiance = 11016, 10465, 9364
; size of each lamp in metres (bigger = softer shadows, a little more noise)
radius = 0.05
; beam half angle in degrees, how soft its edge is (0..1) and how much it is brighter in the
; middle (focus, 0 = even)
cone = 38
softness = 0.15
focus = 1.0
; beam aimed this many degrees below straight ahead (positive = down, negative = up, 0 = level; -30..30)
pitch = 0.25
; lamp moved this many metres ahead of the headlight (in front of the glass, so the lamp's own model does not
; block it)
forward = 0.08
; light beams in fog, dust and rain (Remix volumetrics); 0 = none
volumetric = 1.0
; Remix's fallback light (rtx.fallbackLightRadiance / Direction in rtx.conf or Alt+X, the faint night light) only
; shines while the scene has no other light, so it went out when the headlights came on. 1 = keep it on while the
; headlights are on and there is no sun; 0 = let it go out
keep_fallback_light = 1
; ---- brights: two high beams, each next to a headlight toward the car's middle, added to the two lamps.
; A tighter cone does not make a beam brighter (Remix only cuts the light off outside the cone); the extra reach
; comes from the extra brightness on the axis (twice as bright = about 1.4x as far). The tight cone keeps that light
; off the near road and the verges, like real high beams.
; brightness of each high beam
brights_radiance = 45441, 43169, 38625
; beam half angle in degrees, and its edge softness. Softness is in a cosine scale: for a narrow cone keep it small
; (12 degrees spans only 0.022; 0.15 would make the beam almost dark)
brights_cone = 15
brights_softness = 0.01
; aim in degrees, positive = down, negative = up (same as pitch)
brights_pitch = -0.25
; metres from each headlight toward the car's middle
brights_inset = 0.17
; extra metres ahead of the headlights (on top of forward), so big front lamps do not hide the high beams
brights_forward = 0.15
; ---- rear: one red light at each of the car's own rear lamps, aimed backwards. Tail lights are on while the
; headlights are on; brake lights whenever you brake (headlights on or off), brighter. Values after GTA IV RTX
; (xoxor4d): cone 0.6 x the headlights' + 5 degrees, aimed a little down. Braking = as bright as a headlight (in
; red), tail light = 66 % dimmer than that.
; 0 = no tail lights / no brake lights
tail_lights = 1
brake_lights = 1
; brightness of each lamp while braking, and as a tail light
brake_radiance = 8262, 165, 83
tail_radiance = 2809, 56, 28
; reverse light: with reverse gear engaged the RIGHT rear lamp turns white (0 = off), brightness per lamp
reverse_light = 1
reverse_radiance = 6000, 6000, 6000
; beam half angle, edge softness and aim in degrees below straight back (as cone, softness, pitch above)
rear_cone = 26.6
rear_softness = 0.15
rear_pitch = 11.3
; metres behind the lamp (outside the lens glass)
rear_back = 0.05
; how far the brake pedal must be pressed (0..1) to light them (off again below half of it)
brake_on = 0.05
; ---- backfire: when the car's exhaust pops (the flame sprite RBR draws), a short orange light flashes at the end of
; the exhaust pipe. 0 = no flash
backfire_light = 1
; as bright as the high beams were before their -15 % (53460), in flame orange
backfire_radiance = 53460, 24057, 6415
; size of the light in metres, seconds it stays after the last flame sprite, metres beyond the pipe end
backfire_radius = 0.15
backfire_hold = 0.12
backfire_out = 0.12
; Remix texture hash of the flame sprite (Textures\particles.dat g_pop.dds; this one is ParticleMod by Kahoo v5).
; Another particle mod has another hash: Alt+X > Game Setup > Step 1 > hover the flame > copy its texture hash here.
backfire_texture = 93E4994710A5380B
; ---- the car's own lamps: 1 = the headlights key also switches the game's lit lamp parts and glow sprites on and
; off (as RBR does for brake lights). The glow sprites only show if the car's skin options have them (RSF launcher,
; e.g. "Headlights on"); cars whose lamp parts are not switchable in their model ini do not change. 0 = leave them
game_lamps = 1
; lamps whose car has its own lit lamp texture (*_lit*.dds, e.g. the BMW M3 E30) glow with this strength
; (read when the game starts; 0 = no glow)
lit_glow = 3
; 1 = the lamps follow the car as it is drawn (in TV and chase cameras it is drawn a little away from where the
; physics has it, which could hide the headlights inside the body); 0 = physics position only
follow_drawn_car = 1
; extra metres the headlights sit ahead of the car (on top of forward), by camera. From outside (chase, TV,
; 3rd-person: the car body is drawn) the car itself can block lamps close to it; in the cockpit views it is not drawn.
outside_view_forward = 0.60
cockpit_view_forward = 0.50

; ---- per car: a section named after the car's model file (Cars\<folder>\<name>.sgc -> [<name>]) overrides any key
; above for that car only. The log (rbrrtx_comp.log) says "car section [..] found" when it is used.
; Example:
; [BMW_M3_E30]
; forward = 0.1

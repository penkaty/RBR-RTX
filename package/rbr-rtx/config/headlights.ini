; RBR-RTX headlights: the car's headlights as real (path-traced) lights. The headlights key (L, keys.ini) steps
; ON 1 (one light from the middle of the car's front, cheapest) -> ON 2 (two lights at the car's own headlights)
; -> OFF. They also come on by themselves when the sun is low (below auto_below_sun) and go off when it is high
; again; once you press the key on a stage, they stay as you set them until the next stage.
; This file is read again at the start of every stage: change a value, restart the stage, compare.

[headlights]
; 0 = no headlights at all (the key does nothing)
enable = 1
; sun height in degrees below which the lights switch on by themselves (none = never)
auto_below_sun = 10
; which mode the automatic switch uses: 1 = one centre light, 2 = two lamps
auto_mode = 2
; brightness (red, green, blue) of each lamp in mode 2, and of the single light in mode 1
; (x27 of the first test build, 2026-10-23; double all three numbers = twice as bright)
radiance = 10800, 10260, 9180
centre_radiance = 18900, 17955, 16065
; size of each lamp in metres (bigger = softer shadows, a little more noise)
radius = 0.02
; beam half angle in degrees (mode 2 / mode 1), how soft its edge is (0..1) and how much it is brighter in the
; middle (focus, 0 = even)
cone = 36
centre_cone = 45
softness = 0.15
focus = 1.0
; beam aimed this many degrees below straight ahead (positive = down, negative = up, 0 = level; -30..30)
pitch = 0
; lamp moved this many metres ahead of the headlight (in front of the glass, so the lamp's own model does not
; block it)
forward = 0.08
; light beams in fog, dust and rain (Remix volumetrics); 0 = none
volumetric = 1.0
; Remix's fallback light (rtx.fallbackLightRadiance / Direction in rtx.conf or Alt+X, the faint night light) only
; shines while the scene has no other light, so it went out when the headlights came on. 1 = keep it on while the
; headlights are on and there is no sun; 0 = let it go out
keep_fallback_light = 1

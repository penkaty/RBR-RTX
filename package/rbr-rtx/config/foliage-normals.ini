; RBR-RTX radial foliage normals (PROTOTYPE). RBR's tree, bush and grass cards have no vertex normals, so path
; tracing lights every card by its own flat face: bushes look like stacks of paper. With this on, each card's
; normals point out of its clump (a bush, a tree crown), the "bent normals" trick of Polycount's foliage page and
; SpeedTree's "puffiness": clumps shade like rounded volumes. Same triangles, no extra rays.
; Only swaying foliage drawn by the faster scenery path (key ff_scenery, default mode) gets it.
; Key foliage_normals (Alt+R) switches it on/off and reads this file again. Remix keeps a mesh's first normals, so
; changed numbers below show after the next stage load (restart the stage), not at once.
; Builds per foliage batch are logged in the logs folder, rbrrtx_foliage_normals.log; rbrrtx_comp.log has a summary.
[radial_normals]
; 1 = on from the start, 0 = off until the key is pressed
enabled = 0
; metres: cards whose centres lie this close to a clump centre share it (bigger = whole trees, smaller = branch clumps)
clump_radius = 2.5
; 1 = fully radial (round), 0 = the cards' own normals (as without this); 0.6-0.8 keeps some leaf variation
mix = 1.0
; tilts every normal up (0 = none, 0.3 = brighter tops, softer undersides)
up_bias = 0.0
; moves each clump centre down by this share of its height (0.3 = normals lean up on the lower half too)
centre_drop = 0.0

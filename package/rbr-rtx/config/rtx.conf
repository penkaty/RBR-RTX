# RTX Remix settings for Richard Burns Rally (RBR-RTX; the proxy points DXVK_RTX_CONFIG_FILE here).
# Settings saved from the Alt+X menu go to user.conf in the game folder (a higher layer that overrides this file);
# rbr-rtx\uninstall.ps1 removes it. Note why each setting is here.

# 2026-10-16: indirect lighting via the Neural Radiance Cache, Medium preset (was ReSTIR GI since 2026-10-15, when NRC
# decayed to dark purple; that was before the camera/UI fixes). Gabiria interior: NRC 40.7 fps vs ReSTIR GI 36.9, and
# less smearing on grass (playtests/2026-10-16-0125-perf-gabiria.md in the dev repo).
# Fallback if a stage drifts purple/dark: set 1 (ReSTIR GI). 0 = importance sampled, 1 = ReSTIR GI, 2 = NRC.
rtx.integrateIndirectMode = 2
# NRC quality: 0 = Medium (cheapest), 1 = High, 2 = Ultra.
rtx.neuralRadianceCache.qualityPreset = 0

# 2026-10-15: RBR's baked car shadow (black quad with an alpha blob, 64x128, Remix hash from a capture on stage 456).
# Remix ray traces the real car shadow; under RT the quad acted like a dark mirror under the car. Ignored = not drawn.
# (2026-10-16 late: Cars\*\textures\light.dds - 660BCAB491C6BCCA in 99 cars - must NOT be ignored: it also draws the
# headlight itself, which went dark. The halos need another fix.)
rtx.ignoreTextures = 0xFA712AFEC1FB39B9, 0xB6381CDF98A5F4CE, 0x960280110ADBEB1D, 0x6BC9918A1038F2A1, 0xE1795F6499FA3D31, 0x5928499B9C83AECB, 0x078A602F87B22D5B
# 2026-10-16 05:50: + the six 32x32 windscreen raindrop sprites (capture 05:35 Loch Ard: windscreen-sized meshes ~1 m from
# the cockpit camera). They are dark textures drawn additively (SRC_ALPHA/ONE); Remix turns that into an emissive surface
# that keeps the texture's opacity (rtx_instance_manager.cpp kAlphaEmissive), so they showed as black squares. The game
# look is a faint glint at most. Later: a real water-drop material in rbr_rtx_materials instead of hiding them.

# 2026-10-16 05:50: coplanar overlays drawn on top of other geometry. Without the decal tag Remix ray traces them as
# surfaces at the same depth as the base, so they fight with it. BMW M3 E30 GrpA gauges: BE6B654308EEAEE6 = label/number
# sheet, F4BC05C699777512 = needle layer the game renders each frame (2048x512 render target), both over the dash.
# 2026-10-22 21:12 (user, Alt+X save on Gabiria): + 0x7F2019735C19AE38 (car texture, CarTextureNoDirt), 0xF58F2C02FE181F24.
# 2026-10-23 (user, Alt+X save): + 0x4E1E551F624BCC14, 0xCA496EC9A9BB6DA6, 0xD600E9C22B9FEE88.
rtx.decalTextures = 0x4E1E551F624BCC14, 0x7F2019735C19AE38, 0xBE6B654308EEAEE6, 0xCA496EC9A9BB6DA6, 0xD600E9C22B9FEE88, 0xF4BC05C699777512, 0xF58F2C02FE181F24

# 2026-10-15 21:30: exposure + tonemapping, tuned live by the user (playtests/2026-10-15-2125-exposure.md).
# Auto-exposure works in EV100: HIGHER EV = DARKER image. The default range (min -2 .. max 5) let it brighten the
# image up to -2 EV when the frame contained the dark cockpit, which blew out the road. Min 0 stops that brightening;
# centre metering weights the windscreen/road. The Global tonemapper looked natural; the default Local one washed it out.
# Max 2 -> 4 (2026-10-17): bright stages (Chirdonhead, tester: 'far too bright') hit the EV 2 cap and could not darken.
rtx.autoExposure.exposureCenterMeteringEnabled = False
rtx.autoExposure.centerMeteringSize = 0.5
rtx.autoExposure.evMinValue = -0.5
rtx.autoExposure.evMaxValue = 5
# 0 = Global, 1 = Local (Remix default)
rtx.tonemappingMode = 0

# 2026-10-17 later: metallic 0.25 / roughness 0.85, user-tuned on the Santa Lucia start (spectators, guardrail).
# 2026-10-15 22:45: defaults for every non-replaced ("legacy") RBR material. Remix's metallic 0.1 / roughness 0.7 made
# grass, gravel and terrain look wet/white in the sun; user tested metallic 0 + roughness 0.85-0.9 live: "slightly
# better" (playtests/2026-10-15-2232-rally-school.md). Real fix for the ground = AutoPBR roughness maps.
rtx.legacyMaterial.metallicConstant = 0.7
rtx.legacyMaterial.roughnessConstant = 0.9
# 2026-10-17 (user, Hualapai look test): sand/ground looked like polished marble, detail lost in the sheen. Picked:
# roughness +0.25 on every material and normal maps x2 (from a K run of +0.1 / x1.5 steps). Remix calls these debug
# scale/bias options; they apply to all opaque materials, replaced ones (base mod PBR) included.
# Later the same day (user, Santa Lucia start, dynamic scene): back to bias 0 / normals x1 with the tuned set below.
rtx.opaqueMaterial.roughnessBias = 0
rtx.opaqueMaterial.normalIntensity = 1

# 2026-10-16: performance profile for 60 fps at 1080p on an RTX 2080 Ti (Turing), measured from the car with Alt+X
# closed (dev repo: docs/research/remix-performance.md, DECISIONS 2026-10-16). 23 fps before -> Rally School 52+,
# Gabiria ~41. Players can raise quality in Alt+X > Graphics Settings; their choices go to user.conf.
# Custom preset, so Remix does not rewrite these values (Auto on Turing = Low, which overrides several of them).
rtx.graphicsPreset = 4
# V-Sync off by default, always (user 2026-10-22). Alt+X Graphics Settings can still turn it on (user.conf).
rtx.enableVsync = 0
rtx.upscalerType = 1
# DLSS: dlssPreset 2 = Custom (respects qualityDLSS). qualityDLSS 1 = Performance (540p internal at 1080p).
# Ultra Performance (0) looked too blurry: textures and detail visibly lost.
rtx.dlssPreset = 2
rtx.qualityDLSS = 1
# Ray Reconstruction on (user 2026-10-16 afternoon), CNN model (0; 1 = Transformer, heavier). Off = NRD denoisers,
# ~2-3 ms faster on Turing.
rtx.enableRayReconstruction = True
rtx.rayreconstruction.model = 0
# One bounce + NRC for the rest; fewer alpha/decal layers for bounce rays (foliage).
rtx.pathMinBounces = 0
rtx.pathMaxBounces = 1
rtx.secondaryRayMaxInteractions = 1
# Low-preset path settings, pinned.
rtx.russianRouletteMaxContinueProbability = 0.7
rtx.russianRoulette1stBounceMinContinueProbability = 0.4
# Stochastic alpha blend ON (2026-10-16 late, user test): with it off, Remix blends RBR's alpha-blended car glass with
# the world behind it and the denoiser smears that world (blurry, blocky view through the windscreen).
rtx.enableStochasticAlphaBlend = True
rtx.di.enableRayTracedBiasCorrection = False
rtx.restirGI.biasCorrectionMode = 1
rtx.restirGI.useReflectionReprojection = False
rtx.denoiseDirectAndIndirectLightingSeparately = False
rtx.postfx.enable = False
# No frame generation on Turing; Reflex on.
rtx.dlfg.enable = False
rtx.reflexMode = 1
# Opacity micromaps speed up alpha-tested foliage. The default budget (1536 MB / 15% of VRAM) ran out on Gabiria and
# La Atalaya with only ~4.8 GB VRAM in use. Do not toggle OMM live in Alt+X: it crashed the GPU (device lost).
rtx.opacityMicromap.enable = False
rtx.opacityMicromap.cache.maxBudgetSizeMB = 3072
rtx.opacityMicromap.cache.maxVidmemSizePercentage = 0.3
# Volumetrics stay ON: with them off Remix falls back to depth fog that turns fog stages (Gabiria) completely grey.


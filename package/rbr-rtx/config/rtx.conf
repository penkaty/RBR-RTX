rtx.particleTextures = 0x40A8944300F54468, 0x869E5A5AF4FA4D7B, 0x93E4994710A5380B, 0x130596EFB09CACAB, 0x88638D2218F80CA0, 0xFEDE9A9B63E51534, 0x06221F2ED28C13E0, 0xAD978CDB8C76CBE5, 0x319E9F719F13C5F6, 0x355D3509150670A7, 0x594EFF9CBAAB6B8D, 0x61ABAB1C99D4E7A1, 0x65025D6C039B6849, 0x6B9FD2DB58B84D7F, 0x953E3B32557F1096, 0xA616967A41C0B00C, 0xA9653C217E8CB002, 0xACE58EA48731283A, 0xD38CA4A163E29A6B, 0xDEC41267157C7786, 0xE602AC00C7295742

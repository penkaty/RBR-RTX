; RBR-RTX wetness: wet roads and puddles that build up while it rains (Remix Plus runtime with the wetness port only;
; the official Remix 1.5.2 has no wet options and ignores this file). The runtime darkens wet ground, fills the hollows
; with mirror-like puddles (ripples, raindrop rings) and reads one value per frame, rtx.wet.globalWetness 0..1: the
; water level rises with it, so puddles grow from the low spots outward and dry from the edges. The proxy drives that
; value: it starts at the track's own condition (RBR's Dry / Damp / Wet), heads to rain_target while the game's rain
; falls (faster the harder it rains) and dries back when the rain stops. Time runs only while driving: pause, menu and
; replays hold it. Saved changes apply on the next game start.

[wetness]
enabled = 1
; wetness at the stage start, by the track condition chosen in the game
dry = 0
damp = 0.3
wet = 0.5
; while it rains: wetness heads to rain_target; rain_minutes = time to get about two thirds of the way there in heavy
; rain (light rain takes twice as long)
rain_target = 0.8
rain_minutes = 4
; after the rain: minutes to dry about two thirds of the way back to the track condition
dry_minutes = 15
; a stage that starts in rain has been raining this long already (some puddles at the start line)
rain_head_start_minutes = 1
; snow: -1 = keep the track condition, 0..1 = this wetness (slush)
snow_target = -1
; runtime options this drives (empty = not sent): the wetness, the rain strength (raindrop rings), rings on/off
option = rtx.wet.globalWetness
rain_option = rtx.wet.rainIntensity
raindrops_option = rtx.wet.raindrops

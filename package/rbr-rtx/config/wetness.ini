; RBR-RTX wetness: wet roads and puddles from the stage's conditions (Remix Plus runtime with the wetness port only; the
; official Remix 1.5.2 has no wet options and ignores this file). The runtime darkens wet ground, fills the hollows with
; mirror-like puddles (ripples, raindrop rings) and reads rtx.wet.globalWetness 0..1: the water level rises with it.
; Weather is static in RBR, so the value is set once per stage: the wetter of the track condition and the weather. Rain
; Intensity follows the rain: heavy 1, light 0.5, none 0. F3 sliders override both live; those two and Raindrops are not
; saved, so the next stage's conditions always apply. Saved changes to this file apply on the next game start.

[wetness]
enabled = 1
; by the track condition chosen in the game (user 2026-11-05; 0.80 is the peak)
dry = 0
damp = 0.40
wet = 0.80
; a dry track when the sky is Light Fog or Heavy Fog
dry_fog = 0.15
; at least this much in rain, on any track condition
rain_light = 0.40
rain_heavy = 0.80
; snow: -1 = keep the track condition, 0..1 = this wetness (slush)
snow_target = -1
; runtime options this drives (empty = not sent): the wetness, the rain strength (raindrop rings), rings on/off
option = rtx.wet.globalWetness
rain_option = rtx.wet.rainIntensity
raindrops_option = rtx.wet.raindrops

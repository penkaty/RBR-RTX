; RBR-RTX hotkeys. Change a key here if it clashes with your driving controls or another plugin, then restart the game.
; A key works only while the game window is active and Ctrl/Alt are not held (Alt+X stays the Remix menu); keys
; written as Alt+<key> work only with Alt held.
; Values: a letter or digit (P), F1..F24, a name (LeftBracket RightBracket Semicolon Quote Comma Period Slash Backslash
; Minus Equals Backquote ScrollLock Pause Home End Insert Delete PageUp PageDown Up Down Left Right Numpad0..Numpad9),
; 0x<Windows key code>, or none to switch an action off.
; None of them is needed to drive (the defaults are the best setup); they are for reporting problems (Alt+K first),
; comparing (press twice: off and back) and tuning. README.txt groups them by when you need them.

[keys]
; REPORT A PROBLEM WHILE DRIVING: every stage is recorded on its own (rbr-rtx\config\report.ini) and zipped into
; rbr-rtx\logs\reports\. Press this the moment something goes wrong: beep, screenshot, the frame times around it;
; that stage's zip gets -marked in its name (send that one)
report_mark = 9
; REPORT A PROBLEM: stage sweep, about 25 seconds with car and camera still, a beep when done; output
; rbr-rtx\logs\sweep-<date-time>\ (screenshots layer by layer, Remix debug views, draw list + texture hashes, Remix scene capture; it presses Pause for that). Again = abort.
sweep = Alt+K
; ray tracing on/off: the same scene as the original raster image, to compare
raytracing = 0
; record everything drawn in the next frame into rbr-rtx\logs (test builds, for bug reports)
frame_dump = 8
; RBR-RTX's camera/objects/sun layer on/off (comparison; path tracing itself stays on)
layer = O
; headlights: OFF -> ON (two lamps) -> BRIGHTS (four lamps) -> OFF; they also switch
; on by themselves when the sun is low (rbr-rtx\config\headlights.ini)
headlights = L
; Remix sun only on/off
sun = Alt+L
; foliage: fuller cut-outs (default) -> with soft-edge pass -> game original
foliage = J
; dust: Remix dust on/off (the game's own dust is then never made). Without Remix dust: the game's dust
; all (default) -> none -> quarter -> half
dust = 7
; cockpit windscreen on (default) / off
windscreen = I
; sky: Remix sky (default) <-> no sky
sky = 6
; debug sun on/off (starts at the game's sun); while on, hold the four keys below to move it
debug_sun = H
debug_sun_left = LeftBracket
debug_sun_right = RightBracket
debug_sun_down = Semicolon
debug_sun_up = Quote
; keep the sun now shown (debug sun or game sun) for this stage and time of day: beep, saved to
; rbr-rtx\config\sun-saved.ini and used from then on. Send that file in to have the suns added for everyone
sun_save = Backslash
; ground second layer on/off: the second texture of two-texture ground (sea, cliffs, road markings) drawn
; again as a decal (compare with and without)
ground_layer = Alt+Y
; performance experiment run (rbr-rtx\config\experiments.ini; result in rbr-rtx\logs\rbrrtx_comp.log)
experiment = Alt+P
; distance culling on/off (rbr-rtx\config\culling.ini)
culling = U
; sun brightness live, 10 % per press, for the game sun and the debug sun (the log shows the value to keep)
sun_brighter = Alt+N
sun_dimmer = Alt+M
; faster scenery (drawn without vertex shaders). Default: static scenery + trees/grass/flags do not sway (faster, and
; no smudged trails). Each press: default -> off (old, slower) -> static only (everything sways) -> default
ff_scenery = K
; opaque cut-outs: trees/props whose texture is fully opaque at the alpha test level are drawn without the alpha test
; (same image). On by default without a key: gains ~0 with Remix's opacity micromaps. Give it a key to compare
opaque_alpha = none
; alpha-card cut-outs: foliage cards clipped to the leaves' outline (empty card area removed; solid sprites drawn
; without the alpha test). Needs outline files (rbr-rtx\alphacut\). Press to compare with the game's cards
alpha_cut = Alt+O
; radial foliage normals (prototype): no key by default. Remix keeps a mesh's first normals, so switching while
; driving shows nothing; set enabled in rbr-rtx\config\foliage-normals.ini and restart the game instead
foliage_normals = none

; RBR-RTX hotkeys. Change a key here if it clashes with your driving controls or another plugin, then restart the game.
; A key works only while the game window is active and Ctrl/Alt are not held (Alt+X stays the Remix menu); keys
; written as Alt+<key> work only with Alt held.
; Values: a letter or digit (P), F1..F24, a name (LeftBracket RightBracket Semicolon Quote Comma Period Slash Backslash
; Minus Equals Backquote ScrollLock Pause Home End Insert Delete PageUp PageDown Up Down Left Right Numpad0..Numpad9),
; 0x<Windows key code>, or none to switch an action off.

[keys]
; record everything drawn in the next frame into rbr-rtx\logs (test builds, for bug reports)
frame_dump = P
; RBR-RTX's camera/objects/sun layer on/off (comparison; path tracing itself stays on)
layer = O
; Remix sun only on/off
sun = L
; foliage: fuller cut-outs (default) -> with soft-edge pass -> game original
foliage = J
; gravel dust: all (default) -> none -> quarter -> half
dust = U
; cockpit windscreen on (default) / off
windscreen = I
; sky: Remix sky (default) <-> no sky
sky = N
; debug sun on/off (starts at the game's sun); while on, hold the four keys below to move it
debug_sun = H
debug_sun_left = LeftBracket
debug_sun_right = RightBracket
debug_sun_down = Semicolon
debug_sun_up = Quote
; performance experiment run (rbr-rtx\config\experiments.ini; result in rbr-rtx\logs\rbrrtx_comp.log)
experiment = K
; distance culling on/off (rbr-rtx\config\culling.ini)
culling = M
; sun brightness live, 10 % per press, for the game sun and the debug sun (the log shows the value to keep)
sun_brighter = Alt+H
sun_dimmer = Alt+N
; faster static scenery (drawn without vertex shaders): static (default) -> + far trees/grass stop swaying -> off
ff_scenery = Alt+J

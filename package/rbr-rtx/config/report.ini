; RBR-RTX stage reports: every stage drive is recorded and zipped into rbr-rtx\logs\reports\
; report-<date-time>-<stage>.zip for bug reports (summary, frame rate and stutter per second, stage and car, hotkeys
; used, warnings, Remix log errors, PC and driver, plugins, these config files). Key 9 (keys.ini report_mark) marks a
; problem while driving: screenshot + the frame times around it, zip named -marked. Nothing is sent anywhere.
; Cost while driving: a few additions per frame and one short line a second; files and zip are written after the stage.

[report]
; 1 = on, 0 = off (nothing recorded or written)
enabled = 1
; how many unmarked stage zips to keep (oldest deleted first; -marked zips are never deleted)
keep = 20
; screenshots per stage for key-9 marks (each one stalls the game ~20-50 ms once; 0 = none)
mark_screenshots = 3

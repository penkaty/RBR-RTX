; RBR-RTX distance culling: far geometry the camera cannot see is left out of path tracing (it only feeds shadows,
; reflections and bounce light). Key M switches it on/off live; K experiment steps can change any value (cull.<name>).
; The log (rbrrtx_comp.log) shows every 10 s what it does or would do: draws considered, culled, distance buckets.

[culling]
; 1 = on. Off by default until tested on more stages.
enabled = 0
; shader name parts that may be culled: Sway = swaying foliage, ObjPos/IO = objects, RLSingleTexture.vso = other
; scenery, RLDouble = ground/road (also its shadow pass)
classes = Sway,ObjPos,IO,RLSingleTexture.vso,RLDouble
; outside the view and farther than this (metres): culled
offscreen_far_m = 100
; INSIDE the view: only farther than this (removes it from the picture!); 0 = never
visible_far_m = 0
; ...and only if smaller on screen than this % of the screen height (one draw = often a whole patch of trees); 0 = any size
visible_max_screen_pct = 0
; only these may be culled while visible: never ground/road (RLDouble), which looked broken when missing
visible_classes = Sway,ObjPos,IO,RLSingleTexture.vso
; never cull anything closer than this to the car
keep_radius_m = 30
; a culled object returns only when 10 % closer than the threshold (no flicker at the edge)
hysteresis = 0.1
; extra metres around each object for the in-view test (objects just outside the screen edge stay)
frustum_margin_m = 5
; RBR-RTX Remix dust (dev runs; key 7 on/off; rbr-remix.ps1 -NoRemixDust = the game's own dust as before).
; Save this file while the game runs: the dust settings are read again within a second (rbrrtx_comp.log shows the
; values read). Each save starts a new dust
; cloud; puffs already in the air finish their life with the old settings.
; Units: metres, seconds, km/h. Colours: red, green, blue, opacity (0..1). Each puff picks a random value between
; a _min and a _max, and fades from its start colour to its end colour over its life.

[dust]
; wheels throwing dust: 4 = all wheels, 2 = the two rear wheels only
wheels = 4
; puffs per second from each wheel
per_wheel_rate = 30
; most puffs alive at once (Remix reserves memory for this many)
max_particles = 20000
; how long a puff lives, seconds
life_min = 4
life_max = 10
; puff size when it starts and when it dies, metres
start_size_min = 0.8
start_size_max = 1.4
end_size_min = 3
end_size_max = 8
; colours (with surface_colour = 1 they are moved toward the colour of the ground under each wheel)
start_color_min = 0.50, 0.43, 0.34, 0.45
start_color_max = 0.62, 0.54, 0.43, 0.60
end_color_min = 0.58, 0.52, 0.43, 0.0
end_color_max = 0.68, 0.62, 0.52, 0.0
; how fast a puff rises out of the ground at the start, m/s, and how wide the puffs spread (degrees from straight up)
rise_speed = 1.5
spread_degrees = 35
; air drag (higher = puffs slow down sooner), gravity (negative = settles down, positive = keeps rising)
drag = 0.8
gravity = -0.4
; swirl: strength (0 = off) and how quickly it changes
turbulence = 1.0
turbulence_frequency = 0.3
; spin of each puff, turns per second
spin = 0.15
; dust starts above this speed and stops below the second one (km/h)
on_above_kmh = 20
off_below_kmh = 20
; puffs start this far above the ground under each wheel, metres
height = 0.1
; dust shows when the car body is drawn (chase, TV, 3rd person) and not in cockpit views, the same test the headlights
; use. Only for the first moments of a stage, before that is known: no dust in these RBR cameras (5 = internal/cockpit,
; 6 = internal backseat, 4 = bonnet, 3 = bumper, 1/2 = chase near/far, 11 = chase).
hide_in_cameras = 5, 6
; dust coloured like the ground under each wheel: 1 = on, 0 = only the colours above. The ground texture is looked up
; once per surface (a quarter second after a wheel reaches it); rbrrtx_comp.log shows each surface's colour
surface_colour = 1
; how much of the ground colour (0 = none, 1 = all), and how much lighter than the ground the dust is
surface_mix = 0.8
surface_brightness = 1.15
; Remix dust follows the game: a wheel throws dust only while one of the game's dust emitters asks for particles
; there (names from the stage's Maps\PS_*.ini; rbrrtx_comp.log lists every emitter met and what it became).
; Game dust emitters (never made, they drive the Remix dust):
dust_emitters = tirespray, dust, sand
; game smoke emitters: never made; on a wheel not throwing dust they start the tarmac smoke below ([smoke])
smoke_emitters = tiresmoke
; never touched (water spray on wet roads, splashes; with the game's particles off they show nothing anyway)
keep_game_emitters = wet, water, splash
; a wheel keeps throwing dust this long after the game's last dust request (ms)
dust_hold_ms = 300

; ---- tarmac tyre smoke (user 2026-10-23). The game's particles are off; the tyres smoke only after a slide of
; slide_seconds without a break (the game asks for tyre smoke at that wheel all the time). Same keys as [dust]; any key
; left out keeps the built-in value. Puffs about half the size of the dust.
[smoke]
enabled = 1
slide_seconds = 2
per_wheel_rate = 30
max_particles = 10000
life_min = 2
life_max = 5
start_size_min = 0.1
start_size_max = 0.5
end_size_min = 1
end_size_max = 4
start_color_min = 0.72, 0.72, 0.72, 0.35
start_color_max = 0.82, 0.82, 0.82, 0.45
end_color_min = 0.80, 0.80, 0.80, 0.0
end_color_max = 0.90, 0.90, 0.90, 0.0
rise_speed = 0.5
spread_degrees = 25
drag = 0.9
gravity = 0.50
turbulence = 1.2
turbulence_frequency = 0.4
spin = 0.15
; smoke only above this speed (km/h); 0 = also standing burnouts
on_above_kmh = 0
height = 0.1
; smoke stays grey-white (1 = coloured like the road, as the dust)
surface_colour = 0

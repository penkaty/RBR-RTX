; RBR-RTX Remix dust (dev runs; key 7 on/off; rbr-remix.ps1 -NoRemixDust = the game's own dust as before).
; Save this file while the game runs: the dust settings are read again within a second (rbrrtx_comp.log shows the
; values read). Each save starts a new dust
; cloud; puffs already in the air finish their life with the old settings.
; Units: metres, seconds, km/h. Colours: red, green, blue, opacity (0..1). Each puff picks a random value between
; a _min and a _max, and fades from its start colour to its end colour over its life.

[dust]
; wheels throwing dust: 4 = all wheels, 2 = the two rear wheels only
wheels = 4
; puffs per second from each wheel
per_wheel_rate = 25
; most puffs alive at once (Remix reserves memory for this many)
max_particles = 150000
; how long a puff lives, seconds
life_min = 4
life_max = 8
; puff size when it starts and when it dies, metres
start_size_min = 0.9
start_size_max = 1.3
end_size_min = 7
end_size_max = 9
; colours
start_color_min = 0.50, 0.43, 0.34, 0.45
start_color_max = 0.62, 0.54, 0.43, 0.60
end_color_min = 0.58, 0.52, 0.43, 0.0
end_color_max = 0.68, 0.62, 0.52, 0.0
; how fast a puff rises out of the ground at the start, m/s, and how wide the puffs spread (degrees from straight up)
rise_speed = 1.5
spread_degrees = 35
; air drag (higher = puffs slow down sooner), gravity (negative = settles down, positive = keeps rising)
drag = 0.8
gravity = -0.4
; swirl: strength (0 = off) and how quickly it changes
turbulence = 1.0
turbulence_frequency = 0.3
; spin of each puff, turns per second
spin = 0.15
; dust starts above this speed and stops below the second one (km/h)
on_above_kmh = 25
off_below_kmh = 20
; puffs start this far above the ground under each wheel, metres
height = 0.1
; no dust in these RBR cameras (5 = internal/cockpit, 6 = internal backseat, 4 = bonnet, 3 = bumper,
; 1/2 = chase near/far, 11 = chase). Empty = dust in every camera.
hide_in_cameras = 5, 6
; the game's own tire particles never made (an emitter whose name contains one of these words, from the stage's
; Maps\PS_*.ini; rbrrtx_comp.log lists every emitter met as "never spawned" or "kept")...
hide_game_emitters = tirespray, tiresmoke, dust, sand
; ...unless its name also contains one of these (water spray on wet roads, splashes)
keep_game_emitters = wet, water, splash

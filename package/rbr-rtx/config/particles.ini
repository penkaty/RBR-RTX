; ---- windscreen drops and snow (user 2026-10-23 run 4; RBR's own windscreen rain never reaches the path-traced glass).
; Real water drops (refracting) and snow flakes on a plane where the windscreen is, in the car's frame, placed from the
; head lamps: bottom/top edge = metres back from the lamps and up from them; widths at the bottom and the top.
; show_plane = 1 draws that plane faint red: move it onto the glass (save the file while driving, read again within
; a second), then set it to 0. Needs one outside view first (the car's model frame is measured from the body draw).
[windscreen]
enabled = 1
show_plane = 0
bottom_back = 1.15
bottom_up = 0.42
top_back = 1.83
top_up = 0.92
width_bottom = 1.65
width_top = 1.20
; drops sit this far outside the plane (m)
lift = 0.004
; rain: drops hitting the glass per second at full (heavy) rain while standing; x (1 + km/h / 50 x speed_factor)
drops_per_second = 60
speed_factor = 1
; drop radius (m)
drop_size_min = 0.0015
drop_size_max = 0.004
; above this speed the air pushes the drops from the centre to the edges: flow_speed m/s per 50 km/h above it,
; flow_up = share of it pushing them up the glass
move_above_kmh = 50
flow_speed = 0.25
flow_up = 0.3
; slower than that, drops at least slide_size big run down at slide_speed (m/s)
slide_size = 0.003
slide_speed = 0.03
; snow: flakes landing per second at full snow while standing, their radius (m), and how long they take to melt
; into a small drop (seconds)
flakes_per_second = 25
flake_size_min = 0.004
flake_size_max = 0.011
melt_seconds_min = 4
melt_seconds_max = 12
; most drops and flakes on the glass at once (each one is a draw)
max_drops = 160

[precipitation]
; weather intensity (percent) from which the heavy presets are used (the game: light 50, heavy 100)
heavy_from = 75
; the game's rain/snow sprite textures (Remix hashes, run 2026-10-23): their draws are skipped while Remix rain/snow runs
game_textures = 40A8944300F54468, 869E5A5AF4FA4D7B, 254D6B130606B00C

; RBR-RTX performance experiments: press K (keys.ini) while the view stays still, e.g. facing a forest; wait until the
; log (rbr-rtx\logs\rbrrtx_comp.log) says "experiments: done". Each step starts from [baseline], then changes what it
; lists. "skip = A,B" hides draws whose shader file name contains A or B; "solid = A,B" draws them without alpha test (Sway = swaying foliage, ObjPos/IO = objects,
; RLDouble = ground/road). rtx.* lines are RTX Remix options set live. Do not save Alt+X settings during a run.
; Edit freely: add [stepN] sections, change values; the file is read at every K press.

[run]
settle_seconds = 3
measure_seconds = 5

[baseline]
; = the shipped rtx.conf values
rtx.enableAlphaTest = True
rtx.secondaryRayMaxInteractions = 4
rtx.primaryRayMaxInteractions = 32
rtx.psrRayMaxInteractions = 32
rtx.pathMaxBounces = 1
rtx.enableCullingInSecondaryRays = False

[step1]
name = alpha test off everywhere (reference from round 1)
rtx.enableAlphaTest = False

[step2]
name = foliage solid (Sway: alpha test off)
solid = Sway

[step3]
name = ground/road solid (RLDouble: alpha test off)
solid = RLDouble

[step4]
name = objects solid (ObjPos/IO: alpha test off)
solid = ObjPos,IO

[step5]
name = other scenery solid (RLSingleTexture.vso: alpha test off)
solid = RLSingleTexture.vso

[step6]
name = shadow passes hidden (*Shadow shaders)
skip = Shadow

[step7]
name = car hidden (Car shaders)
skip = Car

[step8]
name = foliage solid + shadow passes hidden
solid = Sway
skip = Shadow

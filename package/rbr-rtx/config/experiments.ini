; RBR-RTX performance experiments: press K (keys.ini) while the view stays still, e.g. facing a forest; wait until the
; log (rbr-rtx\logs\rbrrtx_comp.log) says "experiments: done". Each step starts from [baseline], then changes what it
; lists. "skip = A,B" hides draws whose shader file name contains A or B; "solid = A,B" draws them without alpha test (Sway = swaying foliage, ObjPos/IO = objects,
; RLDouble = ground/road). rtx.* lines are RTX Remix options set live; cull.* lines set the distance culling (culling.ini names). Do not save Alt+X settings during a run.
; Edit freely: add [stepN] sections, change values; the file is read at every K press.

[run]
settle_seconds = 3
measure_seconds = 5

[baseline]
; = the shipped rtx.conf values
rtx.enableAlphaTest = True
rtx.secondaryRayMaxInteractions = 4
rtx.primaryRayMaxInteractions = 32
rtx.psrRayMaxInteractions = 32
rtx.pathMaxBounces = 1
rtx.enableCullingInSecondaryRays = False
rtx.enableStochasticAlphaBlend = True
cull.enabled = 0

[step1]
name = cull off-screen beyond 50 m (all classes)
cull.enabled = 1
cull.offscreen_far_m = 50

[step2]
name = cull off-screen beyond 100 m (all classes)
cull.enabled = 1
cull.offscreen_far_m = 100

[step3]
name = cull off-screen beyond 200 m (all classes)
cull.enabled = 1
cull.offscreen_far_m = 200

[step4]
name = cull off-screen beyond 50 m, foliage only
cull.enabled = 1
cull.offscreen_far_m = 50
cull.classes = Sway

[step5]
name = cull off-screen beyond 50 m, keep radius 15 m
cull.enabled = 1
cull.offscreen_far_m = 50
cull.keep_radius_m = 15

[step6]
name = cull off-screen 50 m + VISIBLE beyond 300 m (look check)
cull.enabled = 1
cull.offscreen_far_m = 50
cull.visible_far_m = 300

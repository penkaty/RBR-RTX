; RBR-RTX performance experiments: press K (keys.ini) while the view stays still, e.g. facing a forest; wait until the
; log (rbr-rtx\logs\rbrrtx_comp.log) says "experiments: done". Each step starts from [baseline], then changes what it
; lists. "skip = A,B" hides draws whose shader file name contains A or B (Sway = swaying foliage, ObjPos/IO = objects,
; RLDouble = ground/road). rtx.* lines are RTX Remix options set live. Do not save Alt+X settings during a run.
; Edit freely: add [stepN] sections, change values; the file is read at every K press.

[run]
settle_seconds = 3
measure_seconds = 5

[baseline]
; = the shipped rtx.conf values
rtx.opacityMicromap.enable = True
rtx.enableAlphaTest = True
rtx.secondaryRayMaxInteractions = 4
rtx.primaryRayMaxInteractions = 32
rtx.psrRayMaxInteractions = 32
rtx.pathMaxBounces = 1
rtx.enableCullingInSecondaryRays = False

[step1]
name = foliage hidden (Sway shaders)
skip = Sway

[step2]
name = objects hidden (ObjPos/IO shaders)
skip = ObjPos,IO

[step3]
name = foliage + objects hidden
skip = Sway,ObjPos,IO

[step4]
name = ground/road hidden (RLDouble shaders)
skip = RLDouble

[step5]
name = opacity micromaps off
rtx.opacityMicromap.enable = False

[step6]
name = alpha test off (leaf cards solid)
rtx.enableAlphaTest = False

[step7]
name = bounce rays: 1 see-through layer
rtx.secondaryRayMaxInteractions = 1

[step8]
name = camera rays: 4 see-through layers
rtx.primaryRayMaxInteractions = 4
rtx.psrRayMaxInteractions = 4

[step9]
name = no bounces (direct light only)
rtx.pathMaxBounces = 0

[step10]
name = backface culling in bounce rays
rtx.enableCullingInSecondaryRays = True
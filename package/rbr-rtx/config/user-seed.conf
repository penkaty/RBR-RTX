# RBR-RTX: start values for Remix's Alt+X User Settings layer (<game>\user.conf). The proxy copies this file there only
# when no user.conf exists. These are the values Remix writes into that layer by itself on every start (Ray Reconstruction
# path-tracer preset, NRC Medium preset, ray-trace mode preset; with rtx.graphicsPreset = Custom they land in User
# Settings). Without them the layer starts empty and Alt+X shows "unsaved changes" (yellow) right after a stage loads.
# Values as Remix itself writes them (exact text matters: Remix compares strings). Same values as rtx.conf.
rtx.demodulate.enableDirectLightBoilingFilter = False
rtx.di.disocclusionSamples = 2
rtx.di.enableBestLightSampling = False
rtx.di.enableDenoiserConfidence = False
rtx.di.enableSampleStealing = False
rtx.di.initialSampleCount = 3
rtx.di.permutationSamplingNthFrame = 1
rtx.di.spatialSamples = 2
rtx.di.stealBoundaryPixelSamplesWhenOutsideOfScreen = False
rtx.enableFirstBounceLobeProbabilityDithering = False
rtx.minOpaqueDiffuseLobeSamplingProbability = 0.05
rtx.minOpaqueSpecularLobeSamplingProbability = 0.05
rtx.neeCache.enableModeAfterFirstBounce = 2
rtx.neuralRadianceCache.smallestResolvableFeatureSizeMeters = 0.06
rtx.neuralRadianceCache.targetNumTrainingIterations = 2
rtx.neuralRadianceCache.terminationHeuristicThreshold = 0.001
rtx.neuralRadianceCache.trainingMaxPathBounces = 6
rtx.postFilterThreshold = 10
rtx.renderPassGBufferRaytraceMode = 0
rtx.renderPassIntegrateDirectRaytraceMode = 0
rtx.renderPassIntegrateIndirectRaytraceMode = 2
rtx.russianRouletteMode = 1
rtx.usePostFilter = False

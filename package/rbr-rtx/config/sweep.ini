; RBR-RTX stage sweep: press Alt+K (keys.ini) on a stage, then do not touch anything for about 15 seconds (a beep says it is done): keep the car
; still (handbrake, or pause the clock with the RSF "pause" if you have it), no camera change, no Alt+X menu. Alt+K
; again aborts. Everything is written to rbr-rtx\logs\sweep-<date>-<time>\ (dev launcher: the run's log folder):
;   stage.txt     stage, country, surface, weather, time of day, camera, sun, proxy modes, atmosphere
;   summary.txt   one line per step: frame time, fps, draws hidden, screenshot file, mean brightness
;   draws.tsv     every draw of one frame: shader, fate, prims, distance, alpha/blend states, textures + Remix hashes
;   textures.tsv  the unique textures of that frame with their Remix hash (for rtx.conf texture lists and mods)
;   NN-*.png      one screenshot per step (the scene taken apart layer by layer, then Remix's debug views)
; Send the whole sweep folder with a bug report. Run it windowed or borderless: in exclusive full screen the
; screenshots come out black (the summary says so).
;
; Format = experiments.ini (key K): every step starts from [baseline], then sets its own values. Extra keys here:
;   shot = 1 screenshot (here: every step, [run] shots = 1), dump = 1 draw list, capture = 1 Remix USD capture,
;   sun = 0 Remix sun off, skip = shader name parts to hide, ff = fixed-function scenery mode.
; Remix debug view numbers: dxvk-remix src/dxvk/shaders/rtx/utility/debug_view_indices.h.

[run]
; 0.5 s per step: 0.35 s for the denoiser to settle after a change, 0.15 s (at least 10 frames) measured
settle_seconds = 0.35
measure_seconds = 0.15
shots = 1
; [baseline] is only used to put options back after a step (nothing is sent when the sweep starts)
apply_baseline = 0

[baseline]
rtx.debugView.debugViewIdx = 0
rtx.enableReplacementAssets = True

; ---- the scene as you see it, then taken apart layer by layer
[step01]
name = full scene
dump = 1

[step02]
name = without sky
skip = SkyDome,Clouds

[step03]
name = without sky and particles
skip = SkyDome,Clouds,Particle

[step04]
name = without foliage (swaying trees, grass, flags)
skip = SkyDome,Clouds,Particle,Sway

[step05]
name = without objects (IO, ObjPos)
skip = SkyDome,Clouds,Particle,Sway,IO,ObjPos

[step06]
name = without car
skip = SkyDome,Clouds,Particle,Sway,IO,ObjPos,Car,GhostCar

[step07]
name = ground and road only (no water)
skip = SkyDome,Clouds,Particle,Sway,IO,ObjPos,Car,GhostCar,Water

[step08]
name = sun off (sky light only)
sun = 0

; ---- what Remix sees: debug views of the full scene
[step09]
name = view albedo
rtx.debugView.debugViewIdx = 23

[step10]
name = view shading normals
rtx.debugView.debugViewIdx = 16

[step11]
name = view triangle normals (facets = geometry)
rtx.debugView.debugViewIdx = 14

[step12]
name = view roughness
rtx.debugView.debugViewIdx = 25

[step13]
name = view material type
rtx.debugView.debugViewIdx = 22

[step14]
name = view emissive
rtx.debugView.debugViewIdx = 30

[step15]
name = view texture coordinates
rtx.debugView.debugViewIdx = 12

[step16]
name = view vertex colour (baked light)
rtx.debugView.debugViewIdx = 18

[step17]
name = view static geometry (FF scenery)
rtx.debugView.debugViewIdx = 4

[step18]
name = view opacity
rtx.debugView.debugViewIdx = 29

[step19]
name = view primary ray interactions (cost)
rtx.debugView.debugViewIdx = 60

[step20]
name = view direct light
rtx.debugView.debugViewIdx = 155

[step21]
name = view indirect light
rtx.debugView.debugViewIdx = 156

; ---- the game's own textures (no PBR mod)
[step22]
name = original textures (replacements off)
rtx.enableReplacementAssets = False
; capture = 1 (Remix USD capture via F9) is not used: the posted key did not reach Remix (2026-10-17 sweep). Capture
; by hand with Alt+X > Capture instead.

; World lights (worldlights.cpp): lamps the game only paints - street lamps, the main menu's lamps - become Remix
; sphere lights from dusk to dawn. Read once at game start.
;
; Find a lamp's texture: stand where it is visible, press 8 (frame dump). Every draw line in rbrrtx_comp.log ends with
; "hash <16 hex digits> at (x y z) r <radius>": the texture's hash and the draw's world bounding sphere.

[lights]
enabled = 1
; on while the sun shown (stage, menu or debug sun) is below this height (degrees), fading in over fade_degrees
on_below_sun = 6
fade_degrees = 4
; at most this many lamps at once, the nearest to the camera
max_lights = 24

; One section per lamp kind:
; [lamp.<name>]
; texture = <Remix hash>[, <hash> ...]   textures the lamp is drawn with
; anchor = top | centre                  top = the top of the draw's bounding sphere (a lone pole's tip)
; uv = u0, v0, u1, v1                    instead of the draw's sphere: the vertices whose TEXCOORD0 lies in this
;                                        rectangle, grouped within 1.5 m, one lamp per group (atlases, sprite batches)
; offset = 0, -0.3, 0                    metres added in the world (y up)
; lumens = 8000                          an LED street lamp 6,000-12,000 lm, an old sodium lamp ~15,000
; colour_temperature = 3000              Kelvin: 2000 sodium orange, 3000 warm white, 4000 neutral LED
; radius = 0.15                          size of the glowing bulb (m)
; volumetric = 1                         glow in fog
; where = any | menu | stage

; The game's own lamp glow (user 2026-11-01: 3C08BAEFF876F222 "what the game often uses as visible lamppost light"):
; a sprite drawn where each bulb is. Every sprite of a draw is one lamp (uv = the whole texture, grouped per sprite).
[lamp.game_glow]
texture = 3C08BAEFF876F222
uv = 0, 0, 1, 1
lumens = 8000
colour_temperature = 3000
radius = 0.15

; Not used (2026-11-01): pole textures are atlases shared with other metal objects (Zeran A60A6459DAFADA84), and the
; menu's lamp-post atlas cell (04153DADDBE42CA1, uv 0.875 0 1 0.125) lit two stripes on the pole, not the bulb. The
; catalog's lamp textures (class emissive_light: streetlight, stlamp_1, lamp, lamp01, ...) are in git history (39e932c).

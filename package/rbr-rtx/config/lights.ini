; World lights (worldlights.cpp): lamps the game only paints - street lamps, the main menu's lamps - become Remix
; sphere lights from dusk to dawn. Read once at game start.
;
; Find a lamp's texture: stand where it is visible, press 8 (frame dump). Every draw line in rbrrtx_comp.log ends with
; "hash <16 hex digits> at (x y z) r <radius>": the texture's hash and the draw's world bounding sphere.

[lights]
enabled = 1
; on while the sun shown (stage, menu or debug sun) is below this height (degrees), fading in over fade_degrees
on_below_sun = 8
fade_degrees = 4
; at most this many lamps at once, the nearest to the camera
max_lights = 16
; lamps found in stage textures (lights-auto.ini, made by tools\lights\find_bulbs.py for the Warthog, Czech, Polish
; and New Zealand stages): 1 = use them, 0 = only the lamps below. Off since 2026-11-01: its pole test found no lamp in
; Legazpi, Zlin or Vinec Skalsko (inverted-L posts: the head hangs on an arm, its glass faces down). Lamps are marked in
; game instead (key lamp_mark, Alt+PageUp: rbr-rtx\config\lights-marked.ini, see below)
auto = 0

; Values for the lamps of lights-auto.ini and lights-marked.ini (their sections hold only texture and uv; a value set in
; the section wins). A lamp of lights-auto.ini is kept only where the pole test passes: a small bright patch of the
; texture with nothing above it and the object reaching min_height metres below it (a lamp head on its pole); marked
; lamps have no pole test. Old street lamps: sodium ~2000 K, mercury/LED ~4000 K.
; 2026-11-02 (user): high-pressure sodium look, strong enough next to the headlights and sun: 150 W HPS ~15000 lm, 2050 K.
[auto]
lumens = 15000
colour_temperature = 2050
radius = 0.12
min_height = 3
offset = 0, -0.05, 0

; One section per lamp kind:
; [lamp.<name>]
; texture = <Remix hash>[, <hash> ...]   textures the lamp is drawn with
; anchor = top | centre | bottom         without uv: top = the top of the draw's bounding sphere (a lone pole's tip);
;                                        with uv: the group's highest y, its centre (default) or its lowest y (the bulb
;                                        under a glass; the default of marked lamps)
; uv = u0, v0, u1, v1                    instead of the draw's sphere: the vertices whose TEXCOORD0 lies in this
;                                        rectangle, grouped within 1.5 m, one lamp per group (atlases, sprite batches);
;                                        uv2 .. uv8 = more rectangles of the same texture
; offset = 0, -0.3, 0                    metres added in the world (y up)
; lumens = 8000                          an LED street lamp 6,000-12,000 lm, an old sodium lamp ~15,000
; colour_temperature = 3000              Kelvin: 2000 sodium orange, 3000 warm white, 4000 neutral LED
; radius = 0.15                          size of the glowing bulb (m)
; volumetric = 1                         glow in fog
; where = any | menu | stage
; Spot kinds (user 2026-11-05: stadium floodlights; streetlamps whose glass faces down). Every mesh drawn with the
; texture casts a cone; lumens are what leaves through the cone.
; cone = 35                              half angle of the cone in degrees (0 = a plain lamp lighting every way)
; direction = 0, -1, 0                   where the cone points, world x y z (y up), default straight down
; aim = x, y, z                          instead of direction: every lamp of the kind points at this world point (the
;                                        middle of a stadium; the 8 frame dump prints world positions)
; cone_softness = 0.2                    0 = a hard edge, 1 = fades from the axis
; focus = 0                              > 0 = brighter toward the axis
; always_on = 1                          lit whatever the sun (default: only from dusk to dawn, as the other lamps)
; A stadium floodlight bank: mark it with Alt+PageUp, then add cone / aim (or direction) to its section in
; lights-marked.ini, or write a section here. Example (texture of the user's floodlight; set its hash):
; [lamp.stadium_flood]
; texture = 0123456789ABCDEF
; anchor = centre
; lumens = 90000
; colour_temperature = 5000
; radius = 0.3
; cone = 30
; cone_softness = 0.3
; aim = 0, 0, 0
; always_on = 1
; glow = 6

; The game's own lamp glow (user 2026-11-01: 3C08BAEFF876F222 "what the game often uses as visible lamppost light"):
; a sprite drawn where each bulb is. Every sprite of a draw is one lamp (uv = the whole texture, grouped per sprite).
[lamp.game_glow]
texture = 3C08BAEFF876F222
uv = 0, 0, 1, 1
lumens = 8000
colour_temperature = 3000
radius = 0.15

; Vinec Skalsko night (stage 401, user 2026-11-01): the night version draws a sprite under every lamp head, "spot_long"
; E0B7F01983285092 (a cone of light, alpha strong at the top). One quad per lamp; the bulb sits at the quad's top edge.
[lamp.vinec_night_cone]
texture = E0B7F01983285092
uv = 0, 0, 1, 1
anchor = top
offset = 0, -0.1, 0
lumens = 8000
colour_temperature = 3000
radius = 0.15
where = stage

; Lamps you marked in game (key lamp_mark, Alt+PageUp) are in lights-marked.ini next to this file, read before this file.

; Not used (2026-11-01): pole textures are atlases shared with other metal objects (Zeran A60A6459DAFADA84), and the
; menu's lamp-post atlas cell (04153DADDBE42CA1, uv 0.875 0 1 0.125) lit two stripes on the pole, not the bulb. The
; catalog's lamp textures (class emissive_light: streetlight, stlamp_1, lamp, lamp01, ...) are in git history (39e932c).

; World lights (worldlights.cpp): lamps the game only paints - street lamps, the main menu's lamp post - become Remix
; sphere lights from dusk to dawn. Read once at game start.
;
; Find a lamp's texture: stand where it is visible, press 8 (frame dump). Every draw line in rbrrtx_comp.log ends with
; "hash <16 hex digits> at (x y z) r <radius>": the lamp object's texture hash and its world bounding sphere.

[lights]
enabled = 1
; on while the sun shown (stage, menu or debug sun) is below this height (degrees), fading in over fade_degrees
on_below_sun = 6
fade_degrees = 4
; at most this many lamps at once, the nearest to the camera
max_lights = 24

; One section per lamp kind:
; [lamp.<name>]
; texture = <Remix hash>[, <hash> ...]   textures the lamp object is drawn with
; anchor = top | centre                  top = the top of the object's bounding sphere (a pole's tip)
; offset = 0, -0.3, 0                    metres added in the world (y up)
; lumens = 8000                          an LED street lamp 6,000-12,000 lm, an old sodium lamp ~15,000
; colour_temperature = 3000              Kelvin: 2000 sodium orange, 3000 warm white, 4000 neutral LED
; radius = 0.15                          size of the glowing bulb (m)
; volumetric = 1                         glow in fog
; where = any | menu | stage

; From the texture catalog (class emissive_light, names streetlight / stlamp_1 / lamp / big_lamp01: tall pole textures)
[lamp.street_pole]
texture = 032CD91A6FDF18F2, 337E9FE8FC09B351, 4ADDBD28A91D64F4, 73EA138D4D4A5B88, 9D9CCBB98B6F48C0, A310848336234190, BA1E3AF909405F33, C5F63774236AC0AB, E01896A70119026D, ECEE5FB8A7C68C44
anchor = top
offset = 0, -0.3, 0
lumens = 8000
colour_temperature = 3000
radius = 0.15

; (names lamp01 / foronlampa3: small lamp textures, the lamp head itself)
[lamp.lamp_head]
texture = 11C0B96CDE429306, 181130556B5CAC0A, 351F901953AF30AC, 3DBC4CF71FDE11CF, 4DED1BCFBA2EDDCB, 76A50A0A3B0A7D90, C71EAEAF081206B8, E01FBCB501CBF902, F27147949AAF172D
anchor = centre
lumens = 6000
colour_temperature = 2700
radius = 0.12

; Main menu lamp post (user 2026-11-01: hash 04153DADDBE42CA1). Its texture is a 512x512 atlas (wood, guardrail, rock)
; drawn in swaying-scenery batches 10-50 m across, so the lamp is found by its atlas cell: the top-right tile
; (pixels 448-512 x 0-64, the lamp fitting). rbrrtx_comp.log "world lights: texture 04153DADDBE42CA1: N lamp(s)".
[lamp.menu_post]
texture = 04153DADDBE42CA1
uv = 0.875, 0.0, 1.0, 0.125
where = menu
lumens = 8000
colour_temperature = 3000
radius = 0.15

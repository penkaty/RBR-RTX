; RBR-RTX stage atmosphere: RBR's weather (sky type, cloud cover), time of day and the stage's region set Remix's
; volumetric haze, sky light and sun. Read once per game start; the log (rbrrtx_comp.log) has an "atmosphere:" line
; per stage with the values used.
;
; Every value multiplies the rtx.conf value (rtx.volumetrics.* and rtx.skyBrightness). rtx.conf holds the look tuned
; on Santa Lucia (Spain, Crisp sky, Clear) = mediterranean region, sky.Crisp, clouds.Clear, time.Noon: all 1.
;   distance   haze visibility: transmittanceMeasurementDistanceMeters x this (lower = denser haze)
;   colour     haze colour: transmittanceColor x this per channel (r, g, b; result kept below 1)
;   sky        Remix sky light: skyBrightness x this
;   sun        the RBR-RTX sun light x this
;   albedo     singleScatteringAlbedo (absolute, 0..1: share of light the haze scatters instead of absorbing)
;   anisotropy scattering direction (absolute, -1..1: higher = bright halo around the sun, fog/rain droplets)
; Region = country of the RSF stage (rsfdata\cache\stages_data.json); stages without one use no region factors.
; Only options that end up different from rtx.conf are sent to Remix. enable = 0 turns all of it off.

[atmosphere]
enable = 1

; ---- regions (climate)
[region.nordic]
countries = FI,SE,NO,EE,LV,LT,IS,CA
distance = 1.6
colour = 1.05, 1.08, 1.2

[region.maritime]
countries = GB,IE,NZ,BE,NL,DK
distance = 0.85
colour = 1.03, 1.07, 1.16
sky = 0.95

[region.central]
countries = PL,CZ,SK,DE,AT,CH,HU,SI,UA,RO,LU,BY,RS,BG
distance = 1.1
colour = 1.02, 1.05, 1.1

[region.mediterranean]
countries = ES,IT,PT,GR,CY,MC,SM,FR,LB,HR,TR,MT
distance = 1

[region.arid]
countries = AU,US,KE,MX,AR,CL,ZA,MA,JO
distance = 1.3
colour = 1, 0.98, 0.93
sky = 1.05

[region.humid]
countries = JP,BR,CN,MG,ID,TH,IN
distance = 0.8
colour = 1.03, 1.06, 1.12


; RBR-RTX stage atmosphere: RBR's weather (sky type, cloud cover), time of day and the stage's region set Remix's
; volumetric haze, sky light and sun. Read once per game start; the log (rbrrtx_comp.log) has an "atmosphere:" line
; per stage with the values used.
;
; Every value multiplies the rtx.conf value (rtx.volumetrics.* and rtx.skyBrightness). rtx.conf holds the look tuned
; on Santa Lucia (Spain, Crisp sky, Clear) = mediterranean region, sky.Crisp, clouds.Clear, time.Noon: all 1.
;   distance   haze visibility: transmittanceMeasurementDistanceMeters x this (lower = denser haze)
;   colour     haze colour: transmittanceColor x this per channel (r, g, b; result kept below 1)
;   sky        Remix sky light: skyBrightness x this
;   sun        the RBR-RTX sun light x this
;   albedo     singleScatteringAlbedo (absolute, 0..1: share of light the haze scatters instead of absorbing)
;   anisotropy scattering direction (absolute, -1..1: higher = bright halo around the sun, fog/rain droplets)
;   sun_max_elev  highest elevation (degrees) of the FALLBACK sun; the lowest value of all matching sections wins
;              (default 60). Stage suns from TrackSettings are used 1:1 up to 80 degrees; only missing or overhead
;              ones (the game then lights from straight above) get the fallback.
;   fallback_sun  "azimuth, elevation" of the fallback sun (time.* sections: RBR's most used SunDir per time of day)
; [stage.<id>] (RBR track id) applies last: per-stage look, e.g. stages baked with deliberately soft shadows.
;   sun_dir.Morning / sun_dir.Noon / sun_dir.Evening / sun_dir = "azimuth, elevation" (degrees, the values the debug
;              sun shows in the log): replaces the stage's SunDir where it does not match the stage's own bake. Each
;              time of day has its own bake (track-<id>_M/_N/_E files), so set it per time.
;   density    haze thickness x this (both ways below; 2 = twice as thick, 0.5 = half)
;   stage_fog  take the haze from the stage's own fog (TrackSettings FogStart/FogEnd of this weather: what the original
;              raster shows) x this strength: like the raster's linear fog, 37 % of the light left half way to FogEnd, 13 % at
;              FogEnd (strength 1; 2 = twice as thick). The colour
;              factors above keep their hue; the haze's scattering takes the game's FogRed/Green/Blue. 0 = off (the
;              distance/colour factors alone). The last matching section that sets it wins.
; Sections apply in this order, each multiplying: [region.*], [sky.<Sky>], [clouds.<Clouds>], [time.<Time>],
; [sky.<Sky>.<Time>] (a weather at a time of day, e.g. [sky.HeavyRain.Evening]), [stage.<id>], [stage.<id>.<Sky>]
; (one stage in one weather, e.g. [stage.458.HeavyRain]).
; Stage descriptions (2026-10-24): when the stage's weather section has a Comment or text after its name that names a
; weather or time of day (English, Spanish, French, Italian, German, Polish, Czech, Finnish: "Rainy night", "Noche
; Despejada", "Poca Lluvia", "PINK DAWN", "CALIMA"), that wins over the game's sky/clouds/time for these sections.
; Times from descriptions: Morning, Noon, Evening, Night, Dawn, Sunset (Night/Dawn/Sunset fall back to Evening/
; Morning/Evening when there is no such section). The log has a "stage weather:" line with what was read.
; Region = country of the RSF stage (rsfdata\cache\stages_data.json); stages without one use no region factors.
; Only options that end up different from rtx.conf are sent to Remix. enable = 0 turns all of it off.
; LIVE TUNING: save this file while driving: it is read again within a second and the stage's look applied anew.

[atmosphere]
enable = 1
; Main menu (no stage loaded): sun azimuth in degrees, the game's height kept. RBR's menu sun (162.5) does not match the
; menu backdrop's baked shadows; 28.0 does (user, 2026-10-22). none = the game's menu sun.
menu_sun_azimuth = 28.0
; Night weather: when the stage's weather section says night (its Comment, e.g. "NIGHT", "NIGHT/DARK", "Starry
; Night"), the sun height in degrees is held between these two values (min, max); RSF night weathers often carry a
; normal day sun. The sun light fades out between +2 and -4 degrees. none = the stage's own sun.
night_sun = -5, 5
; Night auto exposure: when the sun goes below the horizon, Remix's lowest exposure (rtx.autoExposure.evMinValue)
; rises from its rtx.conf value to this at -12 degrees, so the dark is not brightened back up too far (higher =
; brighter night). Was evMaxValue - 1 = 4 before 2026-10-23.
night_ev_min = 3.0

; ---- regions (climate)
[region.nordic]
countries = FI,SE,NO,EE,LV,LT,IS,CA
; ~60-65 N: midsummer noon ~50 degrees
sun_max_elev = 50
distance = 1.6
colour = 1.05, 1.08, 1.2

[region.maritime]
countries = GB,IE,NZ,BE,NL,DK
; ~52-57 N: midsummer noon ~57-61 degrees
sun_max_elev = 55
distance = 0.85
colour = 1.03, 1.07, 1.16
sky = 0.95

[region.central]

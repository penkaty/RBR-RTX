; RBR-RTX stage atmosphere: RBR's weather (sky type, cloud cover), time of day and the stage's region set Remix's
; volumetric haze, sky light and sun. Read once per game start; the log (rbrrtx_comp.log) has an "atmosphere:" line
; per stage with the values used.
;
; Every value multiplies the rtx.conf value (rtx.volumetrics.* and rtx.skyBrightness). rtx.conf holds the look tuned
; on Santa Lucia (Spain, Crisp sky, Clear) = mediterranean region, sky.Crisp, clouds.Clear, time.Noon: all 1.
;   distance   haze visibility: transmittanceMeasurementDistanceMeters x this (lower = denser haze)
;   colour     haze colour: transmittanceColor x this per channel (r, g, b; result kept below 1)
;   sky        Remix sky light: skyBrightness x this
;   sun        the RBR-RTX sun light x this
;   albedo     singleScatteringAlbedo (absolute, 0..1: share of light the haze scatters instead of absorbing)
;   anisotropy scattering direction (absolute, -1..1: higher = bright halo around the sun, fog/rain droplets)
;   sun_max_elev  highest elevation (degrees) of the FALLBACK sun; the lowest value of all matching sections wins
;              (default 60). Stage suns from TrackSettings are used 1:1 up to 80 degrees; only missing or overhead
;              ones (the game then lights from straight above) get the fallback.
;   fallback_sun  "azimuth, elevation" of the fallback sun (time.* sections: RBR's most used SunDir per time of day)
; [stage.<id>] (RBR track id) applies last: per-stage look, e.g. stages baked with deliberately soft shadows.
;   sun_dir.Morning / sun_dir.Noon / sun_dir.Evening / sun_dir = "azimuth, elevation" (degrees, the values the debug
;              sun shows in the log): replaces the stage's SunDir where it does not match the stage's own bake. Each
;              time of day has its own bake (track-<id>_M/_N/_E files), so set it per time.
; Region = country of the RSF stage (rsfdata\cache\stages_data.json); stages without one use no region factors.
; Only options that end up different from rtx.conf are sent to Remix. enable = 0 turns all of it off.

[atmosphere]
enable = 1

; ---- regions (climate)
[region.nordic]
countries = FI,SE,NO,EE,LV,LT,IS,CA
; ~60-65 N: midsummer noon ~50 degrees
sun_max_elev = 50
distance = 1.6
colour = 1.05, 1.08, 1.2

[region.maritime]
countries = GB,IE,NZ,BE,NL,DK
; ~52-57 N: midsummer noon ~57-61 degrees
sun_max_elev = 55
distance = 0.85
colour = 1.03, 1.07, 1.16
sky = 0.95

[region.central]
countries = PL,CZ,SK,DE,AT,CH,HU,SI,UA,RO,LU,BY,RS,BG
distance = 1.1
colour = 1.02, 1.05, 1.1

[region.mediterranean]
countries = ES,IT,PT,GR,CY,MC,SM,FR,LB,HR,TR,MT
distance = 1

[region.arid]
countries = AU,US,KE,MX,AR,CL,ZA,MA,JO
distance = 1.3
colour = 1, 0.98, 0.93
sky = 1.05

[region.humid]
countries = JP,BR,CN,MG,ID,TH,IN
distance = 0.8
colour = 1.03, 1.06, 1.12

; ---- RBR sky types
[sky.Crisp]
distance = 1

[sky.Hazy]
distance = 0.55
colour = 1, 0.99, 0.97
sun = 0.9

[sky.NoRain]
; overcast, dry
distance = 0.75
colour = 1.04, 1.07, 1.15
sky = 0.9
sun = 0.8

[sky.LightRain]
distance = 0.45
colour = 1.05, 1.09, 1.2
sky = 0.75
sun = 0.55
albedo = 0.9

[sky.HeavyRain]
distance = 0.25
colour = 1.06, 1.1, 1.22
sky = 0.6
sun = 0.3
albedo = 0.92
anisotropy = 0.3

[sky.NoSnow]
distance = 0.8
colour = 1.07, 1.1, 1.24
sun = 0.85

[sky.LightSnow]
distance = 0.4
colour = 1.08, 1.11, 1.25
sky = 0.85
sun = 0.6
albedo = 0.95

[sky.HeavySnow]
distance = 0.2
colour = 1.08, 1.11, 1.25
sky = 0.7
sun = 0.35
albedo = 0.97

[sky.LightFog]
distance = 0.3
colour = 1.07, 1.1, 1.2
sky = 0.85
sun = 0.5
albedo = 0.95
anisotropy = 0.4

[sky.HeavyFog]
distance = 0.12
colour = 1.08, 1.11, 1.22
sky = 0.7
sun = 0.25
albedo = 0.97
anisotropy = 0.5

; ---- cloud cover
[clouds.Clear]
sun = 1

[clouds.PartCloud]
sky = 0.95
sun = 0.9

[clouds.LightCloud]
distance = 0.95
sky = 0.88
sun = 0.7

[clouds.HeavyCloud]
distance = 0.9
colour = 1.02, 1.04, 1.08
sky = 0.75
sun = 0.45

; ---- time of day
[time.Morning]
distance = 0.85
colour = 1, 0.97, 0.93
; SunDir -0.843 -0.504 0.187 (486 sections)
fallback_sun = 167.5, 30.3

[time.Noon]
distance = 1
; SunDir -0.118 -0.765 0.633 (220 sections)
fallback_sun = 100.5, 49.9

[time.Evening]
distance = 0.9
colour = 1, 0.96, 0.9
; SunDir 0.932 -0.306 0.195 (126 sections; opposite side to the morning preset)
fallback_sun = 11.8, 17.8

; ---- stages
; Rosciszow-Walim / Walim-Rosciszow: baked with deliberately soft shadows (the artists' workaround for game limits).
; A full-strength sharp sun is harsher than the bake (user 2026-10-21, matched by lowering the sun with Alt+N).
[stage.458]
; user 2026-10-21: 10 x Alt+N on top of 0.6 (0.6 x 0.39)
sun = 0.23
[stage.459]
sun = 0.23

; Carvalho de Rei 2008 reverse: Morning SunDir (-84.7 / 53.8, comma decimals in the file) does not match the bake;
; user's debug-sun match 2026-10-21 (Crisp, Clear).
[stage.372]
sun_dir.Morning = 174.3, 22.3

; Santa Lucia: only Evening has a SunDir (-2,-2,-2 = -135 / 35.3); Morning and Noon have none (fallback).
; Noon ("CALIMA" preset) matched by the user 2026-10-21 (~20 deg left of the 100.5 fallback); Morning ("SUNNY")
; matched 2026-10-22 (the fallback 167.5 / 30.3 put the stage in the mountain's shadow).
[stage.509]
sun_dir.Morning = -110.5, 37.8
sun_dir.Noon = 80.0, 49.9

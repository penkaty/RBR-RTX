# The user's Legacy Material Defaults for running WITHOUT the PBR mod (saved 2026-11-06, used until then).
# They made non-PBR stages bearable: a little sheen and self-light on every original texture.
# With the PBR mod on, use rtx.conf's values instead (metallic 0.1, roughness 0.7, emissive 0).
# To use: copy these three lines over the same keys in rtx.conf, or set them in Alt+X > Legacy Material Defaults.
rtx.legacyMaterial.metallicConstant = 0.7
rtx.legacyMaterial.roughnessConstant = 0.9
rtx.legacyMaterial.emissiveIntensity = 0.5

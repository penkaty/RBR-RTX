# The user's settings for running WITH the PBR packs (their 2026-11-06 21:25 Alt+X save, rtx.conf until 2026-11-07).
# rtx.conf went back to the no-PBR set (legacy-material-no-pbr.conf) with displacement off on 2026-11-07: with these
# values the Chirdonhead start ran 53 fps against 63 fps before (displacement also in indirect lighting, ReSTIR GI, NEE).
# To use: copy these lines over the same keys in rtx.conf, or set them in Alt+X.
rtx.displacement.mode = 3
rtx.displacement.displacementFactor = 1
rtx.displacement.displacementInFactor = 0.15
rtx.displacement.displacementOutFactor = 0.15
rtx.legacyMaterial.metallicConstant = 0.1
rtx.legacyMaterial.roughnessConstant = 0.7
rtx.legacyMaterial.emissiveIntensity = 0

# Remix bridge settings for RBR under REMIX PLUS 2.0.0 (RBR-RTX, config-remixplus; goes to <runtime>\.trex\bridge.conf).
# Separate from remix\.trex\bridge.conf (Remix 1.5.2). The bridge's d3d9.dll and .trex\NvRemixBridge.exe must come from
# the same Remix Plus release.

# Remix Plus 2.0.0's own lines (its shipped bridge.conf).
# A larger command queue keeps the game from waiting on the bridge in draw-heavy scenes.
clientCmdQueueSize = 16384
# Bridge performance summary in the bridge logs every 300 frames.
perfLogIntervalFrames = 300

# RBR-RTX: the proxy uses the Remix API (sun, headlights, dust, rain, windscreen; remixplus_api.cpp).
exposeRemixApi = True
# RBR-RTX, from the 1.5.2 file: bigger channel and data queue for the stage loads (RSF stages upload a lot at once).
eliminateRedundantSetterCalls = True
clientChannelMemSize = 192MB
serverChannelMemSize = 64MB
clientDataQueueSize = 10000

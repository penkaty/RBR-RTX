; RBR-RTX stage atmosphere for REMIX PLUS with the NUMOS sky (rtx.skyMode = 1 in config-remixplus\rtx.conf). Separate
; from config\atmosphere.ini (Remix 1.5.2): the proxy reads this file only on Remix Plus.
;
; What the proxy does with NUMOS (rbrrtx_comp.log has an "atmosphere: NUMOS:" line per stage with the values sent):
;  - SUN: the same sun as on 1.5.2 (the stage's TrackSettings SunDir, the [stage.*] fixes below, sun-saved.ini, the
;    debug sun), sent as rtx.atmosphere.sunElevation / sunRotation. NUMOS lights the scene with it (and with its moon
;    at night); the proxy creates no sun light of its own.
;  - WEATHER: rtx.weather.gameWeather = ids from the game's weather, most specific first:
;      stage<id>_<Sky>_<Clouds>, stage<id>_<Sky>, stage<id>, <Sky>_<Clouds>_<Time>, <Sky>_<Clouds>, <Sky>, <Clouds>, RBR
;    e.g. "stage458_HeavyRain_HeavyCloud, ..., HeavyRain_HeavyCloud_Evening, HeavyRain_HeavyCloud, HeavyRain,
;    HeavyCloud, RBR". NUMOS shows the first one a preset binds: config-remixplus\weather\rbr-*.conf
;    (weather.bindings = ...). Sky = Crisp Hazy NoRain LightRain HeavyRain NoSnow LightSnow HeavySnow LightFog HeavyFog,
;    Clouds = Clear PartCloud LightCloud HeavyCloud, Time = Morning Noon Evening (Night Dawn Sunset from a stage's
;    description). Edit presets in game: Alt+X > developer menu > Sky > Weather > Open Weather Presets.
;  - FOG: rtx.atmosphere.fogVisibilityMeters per stage, from the sections below (the presets leave the fog out).
;  - HAZE: rtx.atmosphere.aerosolDensity = the rtx.conf value x the aerosol factors (regions); presets that write
;    "aerosolDensity = x<v>" multiply that.
;
; Keys (sections apply in this order: [region.*], [sky.<Sky>], [clouds.<Clouds>], [time.<Time>], [sky.<Sky>.<Time>],
; [stage.<id>], [stage.<id>.<Sky>]):
;   stage_fog       s: fog from the stage's own TrackSettings fog (UseFog, FogEnd: everything fogged at FogEnd on the
;                   raster image): visibility = FogEnd / s (2 = twice as thick). Used when the stage has fog on.
;   fog_visibility  m: visibility in metres when stage_fog does not apply (0 = no fog). Last section that sets it wins.
;   density         divides the visibility (2 = twice as thick).
;   aerosol         x NUMOS's aerosolDensity (haze; lower = clearer air).
;   sun             x NUMOS's sunIntensity (per-stage softer sun for stages baked with soft shadows).
;   sun_max_elev, fallback_sun, sun_dir.<Time>, sun_dir: as in config\atmosphere.ini (fallback and per-stage suns).
; LIVE TUNING: save this file while driving: it is read again within a second and the stage's look applied anew.

[atmosphere]
enable = 1
; Main menu: sun azimuth (degrees) matching the menu backdrop's bake (user 2026-10-22). none = the game's menu sun.
menu_sun_azimuth = 28.0
; Night weather (a stage's description says night): the sun is held between these elevations (min, max). NUMOS
; draws a real night below the horizon (stars, the moon, airglow), so lower than 1.5.2's -5, 5.
night_sun = -18, -12

[numos]
; NUMOS's sun angle from the proxy's sun direction: rotation = azimuth_sign x atan2(x, z) + azimuth_offset (degrees).
; If NUMOS's shadows come out mirrored (sign) or turned (offset) against the stage's baked shadows, fix it here.
azimuth_offset = 0
azimuth_sign = 1
; Ground level for NUMOS (altitude zero of its clouds, height fog and sky). car = the car's height - ground_offset
; (metres), followed smoothly; auto = NUMOS measures it with rays from above, which land on the tree tops on forest
; stages and put the camera "underground": a grey wall over the whole view (run 20261029-045150, Witoszow, Legazpi, Peklo).
ground = car
ground_offset = 0.5
; Fog albedo from the stage's own fog colour (TrackSettings FogRed/Green/Blue) while its fog is on: RBR's night fogs are
; near black, so they stay dark instead of a bright wall. 0 = NUMOS's / the presets' value.
fog_albedo_from_game = 1

; ---- regions (climate): haze and the fallback sun's height
[region.nordic]
countries = FI,SE,NO,EE,LV,LT,IS,CA
sun_max_elev = 50
aerosol = 0.65

[region.maritime]
countries = GB,IE,NZ,BE,NL,DK
sun_max_elev = 55
aerosol = 1.2

[region.central]
countries = PL,CZ,SK,DE,AT,CH,HU,SI,UA,RO,LU,BY,RS,BG
aerosol = 0.9

[region.mediterranean]
countries = ES,IT,PT,GR,CY,MC,SM,FR,LB,HR,TR,MT
aerosol = 1

[region.arid]
countries = AU,US,KE,MX,AR,CL,ZA,MA,JO
aerosol = 0.8

[region.humid]
countries = JP,BR,CN,MG,ID,TH,IN
aerosol = 1.25

; ---- RBR sky types: fog. Clouds, cloud cover and sky colour come from the weather presets.
[sky.Crisp]
fog_visibility = 0

[sky.Hazy]
fog_visibility = 6000

[sky.NoRain]
fog_visibility = 15000

[sky.LightRain]
stage_fog = 0.8
fog_visibility = 3000

[sky.HeavyRain]
stage_fog = 1.0
fog_visibility = 1200

[sky.NoSnow]
fog_visibility = 0

[sky.LightSnow]
stage_fog = 0.8
fog_visibility = 2000

[sky.HeavySnow]
stage_fog = 1.0
fog_visibility = 700

[sky.LightFog]
stage_fog = 1.0
fog_visibility = 500

[sky.HeavyFog]
stage_fog = 1.0
fog_visibility = 180

; ---- time of day: fallback suns (RBR's most used SunDir per time; used when a stage has none or an overhead one)
[time.Morning]
fallback_sun = 167.5, 30.3

[time.Noon]
fallback_sun = 100.5, 49.9

[time.Evening]
fallback_sun = 11.8, 17.8

[time.Night]
fallback_sun = 11.8, 17.8

[time.Dawn]
fallback_sun = 167.5, 30.3

[time.Sunset]
fallback_sun = 11.8, 17.8

; ---- stages (copied from config\atmosphere.ini 2026-10-29; the suns match the stages' bakes, whatever the renderer)
; Rosciszow-Walim / Walim-Rosciszow: baked with deliberately soft shadows; a full sharp sun is harsher than the bake.
[stage.458]
sun = 0.23
[stage.459]
sun = 0.23


; RBR-RTX stage atmosphere for Remix Plus with the NUMOS sky (-RemixPlus2). Remix 1.5.2 uses config\atmosphere.ini.
; Saved while driving = read again within a second. rbrrtx_comp.log has an "atmosphere: NUMOS:" line per stage.
;
; SUN: the stage's own sun (TrackSettings SunDir, the [stage.*] fixes below, sun-saved.ini), sent to NUMOS.
; WEATHER: the game's weather becomes NUMOS weather ids, most specific first (stage<id>_<Sky>_<Clouds>, ...,
;   <Sky>_<Clouds>_<Time>, <Sky>, <Clouds>, RBR); the first one a preset in config-remixplus\weather binds is shown.
;   Edit presets in game: Alt+X > developer menu > Sky > Weather.
; FOG and HAZE: from the sections below (presets leave the fog out).
;
; Section keys (applied in this order: [region.*], [sky.<Sky>], [clouds.<Clouds>], [time.<Time>], [sky.<Sky>.<Time>],
; [stage.<id>], [stage.<id>.<Sky>]):
;   stage_fog       follow the stage's own fog when it is on: visibility = its FogEnd / this (2 = twice as thick)
;   fog_visibility  metres of visibility when the stage's fog is off (0 = no fog)
;   density         divides the visibility (2 = twice as thick)
;   aerosol         x NUMOS's haze (lower = clearer air)
;   sun             x NUMOS's sun strength (stages baked with soft shadows)
;   sun_max_elev, fallback_sun, sun_dir.<Time>, sun_dir: fallback and per-stage suns, as in config\atmosphere.ini

[atmosphere]
enable = 1
; main menu sun azimuth (degrees), matching the menu backdrop; none = the game's menu sun
menu_sun_azimuth = 28.0
; Night presets (a stage's description or name says night): the sun is held between these heights (min, max).
; night_sun for real night; dusk_sun for night presets in the game's evening or morning slot (late evening / early
; morning, e.g. Rallysprint Hondarribia 2011). none = the stage's own sun
night_sun = -18, -12
dusk_sun = -9, -5

[numos]
; Moon: date = today's phase from the PC's clock (0.5 = full, 0 = new: then only starlight), or a fixed phase 0..1,
; or none = NUMOS's own real moon (follows NUMOS's date and clock, often below the horizon). It stands opposite the
; sun, at least moon_min_elevation degrees high at night; its light is the real Moon's (about 0.25 lux when full)
moon_phase = date
moon_min_elevation = 25
; NUMOS's sun rotation = azimuth_sign x atan2(x, z) + azimuth_offset; fix here if shadows come out mirrored or turned
azimuth_offset = 0
azimuth_sign = 1
; ground level for NUMOS's clouds and fog: car = the car's height - ground_offset (m); auto = NUMOS's own (lands on
; tree tops on forest stages: a grey wall over the view)
ground = car
ground_offset = 0.5
; 1 = fog colour from the stage's own fog (night fogs stay dark); 0 = the presets' value
fog_albedo_from_game = 1
; metres added to every fog's visibility (no fog stays no fog)
fog_extra = 20
; a stage's own fog: halfway = half fogged at the same distance as in RBR; end = fully fogged at its FogEnd (thicker)
stage_fog_match = halfway

[menu]
; Main menu: your base NUMOS weather and the menu sun. Back from a stage, the menu starts at the stage's time of day
; and the sun runs forward to the menu sun over this many seconds (0 = the menu sun at once). The menu car's lamps
; come on while the sun is below auto_below_sun (headlights.ini).
transition_seconds = 20

; ---- regions (climate): haze and the fallback sun's height
[region.nordic]
countries = FI,SE,NO,EE,LV,LT,IS,CA
sun_max_elev = 50
aerosol = 0.65

[region.maritime]
countries = GB,IE,NZ,BE,NL,DK
sun_max_elev = 55
aerosol = 1.2

[region.central]
countries = PL,CZ,SK,DE,AT,CH,HU,SI,UA,RO,LU,BY,RS,BG
aerosol = 0.9

[region.mediterranean]
countries = ES,IT,PT,GR,CY,MC,SM,FR,LB,HR,TR,MT
aerosol = 1

[region.arid]
countries = AU,US,KE,MX,AR,CL,ZA,MA,JO
aerosol = 0.8

[region.humid]
countries = JP,BR,CN,MG,ID,TH,IN
aerosol = 1.25

; ---- RBR sky types: fog. Every sky type follows the stage's own fog when it is on (user 2026-10-29: many stages
; have a slight fog even in clear weather, on purpose). Clouds, cloud cover and sky colour come from the presets.
[sky.Crisp]
stage_fog = 1.0
fog_visibility = 0

[sky.Hazy]
stage_fog = 1.0
fog_visibility = 6000

[sky.NoRain]
stage_fog = 1.0
fog_visibility = 15000

[sky.LightRain]
stage_fog = 0.8
fog_visibility = 3000

[sky.HeavyRain]
stage_fog = 1.0
fog_visibility = 1200

[sky.NoSnow]
stage_fog = 1.0
fog_visibility = 0

[sky.LightSnow]
stage_fog = 0.8
fog_visibility = 2000

[sky.HeavySnow]
stage_fog = 1.0
fog_visibility = 700

[sky.LightFog]
stage_fog = 1.0
fog_visibility = 500

[sky.HeavyFog]
stage_fog = 1.0
fog_visibility = 180

; ---- time of day: fallback suns (RBR's most used SunDir per time; used when a stage has none or an overhead one)
[time.Morning]
fallback_sun = 167.5, 30.3

[time.Noon]
fallback_sun = 100.5, 49.9

[time.Evening]
fallback_sun = 11.8, 17.8

[time.Night]
fallback_sun = 11.8, 17.8

[time.Dawn]
fallback_sun = 167.5, 30.3

[time.Sunset]
fallback_sun = 11.8, 17.8


; RBR-RTX class materials: one Remix material per kind of surface, for every game texture with no PBR set of its own.
; tools\pbr\make_class_materials.py reads this table and the texture catalog (remix\catalog\classes.csv: a class per
; texture hash, from its name and archive) and writes the mod rtx-remix\mods\a_rbrrtx_classmat. The game's own colour
; texture stays; only how the surface reflects light changes. Textures with a real PBR set (z_rbrrtx_pbr_* mods) or a
; hand-made material keep theirs (mods named later win).
;
; Keys per [class]:
;   roughness   0 = mirror, 1 = fully matte (dry ground 0.8-0.95, tarmac 0.7-0.8, wet looks come from rtx.wet.*)
;   metallic    0 for everything that is not bare metal (dirt, stone, wood, paint over metal)
;   normal      shared tiling detail normal: none, asphalt, gravel, dirt, rock, concrete, wood, snow, bark
;   normal_strength  how strong the shared detail bumps are (0.1 subtle .. 1 strong); the bumps repeat with the
;               texture, so keep them small
;   skip = 1    leave the class out (handled elsewhere or must not change)
; After editing: tools\pbr\.venv\Scripts\python.exe tools\pbr\make_class_materials.py, then restart the game.

[road_tarmac]
roughness = 0.75
metallic = 0
normal = asphalt
normal_strength = 0.35

[road_generic]
roughness = 0.82
metallic = 0
normal = gravel
normal_strength = 0.3

[road_gravel]
roughness = 0.85
metallic = 0
normal = gravel
normal_strength = 0.45

[road_snow]
roughness = 0.55
metallic = 0
normal = snow
normal_strength = 0.2

[road_line]
roughness = 0.6
metallic = 0
normal = asphalt
normal_strength = 0.2

[ground_generic]
roughness = 0.9
metallic = 0
normal = dirt
normal_strength = 0.3

; mud and soil: a little smoother than dry dirt, so it catches a soft sheen
[ground_dirt]
roughness = 0.78
metallic = 0
normal = dirt
normal_strength = 0.35

[ground_grass]
roughness = 0.95
metallic = 0
normal = none

[ground_far]
roughness = 0.95
metallic = 0
normal = none

[rock]
roughness = 0.8
metallic = 0
normal = rock
normal_strength = 0.5

[building]
roughness = 0.85
metallic = 0
normal = concrete
normal_strength = 0.25

[wood]
roughness = 0.75
metallic = 0
normal = wood
normal_strength = 0.3

; painted or weathered metal (barriers, posts, sheds): partly metallic so it reads as metal, not chrome
[metal]
roughness = 0.5
metallic = 0.6
normal = none

[vehicle_prop]
roughness = 0.5
metallic = 0.3
normal = none

[sign_banner]
roughness = 0.6
metallic = 0
normal = none

[fence_cutout]
roughness = 0.65
metallic = 0.4
normal = none

[cutout_generic]
roughness = 0.85
metallic = 0
normal = none

[people]
roughness = 0.8
metallic = 0
normal = none

[prop]
roughness = 0.75
metallic = 0
normal = none

; ---- left alone: foliage has its own card normals and mod, the rest are not surfaces or are handled elsewhere
[foliage_card]
skip = 1
[foliage_solid]
skip = 1

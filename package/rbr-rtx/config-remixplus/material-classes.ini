; RBR-RTX class materials: one Remix material per kind of surface, for every game texture with no PBR set of its own.
; tools\pbr\make_class_materials.py reads this table and the texture catalog (remix\catalog\classes.csv: a class per
; texture hash, from its name and archive) and writes the mod rtx-remix\mods\a_rbrrtx_classmat. The game's own colour
; texture stays; only how the surface reflects light changes. Textures with a real PBR set (z_rbrrtx_pbr_* mods) or a
; hand-made material keep theirs (mods named later win).
;
; Keys per [class]:
;   roughness   0 = mirror, 1 = fully matte (dry ground 0.8-0.95, tarmac 0.7-0.8, wet looks come from rtx.wet.*)
;   metallic    0 for everything that is not bare metal (dirt, stone, wood, paint over metal)
;   normal      shared tiling detail normal: none, asphalt, gravel, dirt, rock, concrete, wood, snow, bark
;   normal_strength  how strong the shared detail bumps are (0.1 subtle .. 1 strong); the bumps repeat with the
;               texture, so keep them small
;   skip = 1    leave the class out (handled elsewhere or must not change)
;   auto = 1    with skip = 1: still give the class per-texture maps in make_auto_materials.py (not in the constants mod)
;
; Per-texture maps (tools\pbr\make_auto_materials.py, local only: derived from the game's textures, never shipped).
; The same table, plus these keys, drives a roughness map and a normal map made from each texture's own picture:
;   rough_var   how much roughness varies inside a texture, as a standard deviation (0 = constant: the class gets no
;               roughness map). Brighter than the texture's average = smoother, dark pits and cracks = rougher.
;   rough_min / rough_max   per-texel clamp of that roughness (tarmac stays >= 0.6: matte). The class roughness stays
;               the texture's mean. Wetness (rtx.wet.*) multiplies it at run time as before.
;   auto_normal bumps from the texture's own luminance (0 = none .. 1 strong), added to the shared detail normal.
; Classes with rough_var = 0 and auto_normal = 0 get nothing from that tool and keep the constants-only material.
; After editing: tools\pbr\.venv\Scripts\python.exe tools\pbr\make_class_materials.py (constants mod, shipped), and
; tools\pbr\pbr.ps1 make_auto_materials --stage N (per-texture maps, local), then restart the game.

[road_tarmac]
roughness = 0.75
metallic = 0
normal = asphalt
normal_strength = 0.35
rough_var = 0.07
rough_min = 0.62
rough_max = 0.9
auto_normal = 0.3


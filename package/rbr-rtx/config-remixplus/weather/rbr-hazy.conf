# RBR-RTX: sky type Hazy (NUMOS's Haze: thin cloud, heavy aerosol). The sky type wins over the cloud cover (its id
# comes first). Fog: the proxy (fog_visibility of [sky.Hazy]), not this preset.
weather.bindings = Hazy
weather.transitionSeconds = 2
weather.enabled = true

rtx.atmosphere.cloudCoverageMean = 0.2
rtx.atmosphere.cloudTypeMean = 0.6
rtx.atmosphere.aerosolDensity = x3.6
rtx.atmosphere.fogHeightFalloffMeters = 800

# RBR-RTX: sky type LightRain (NUMOS's Drizzle sky: broken cloud under a grey sheet). Fog: the proxy (the stage's
# own fog, stage_fog of [sky.LightRain]), not this preset. Rain itself: the proxy's Remix API rain (particles.ini).
weather.bindings = LightRain
weather.transitionSeconds = 2
weather.enabled = true

rtx.atmosphere.cloudCoverageMean = 0.58
rtx.atmosphere.cloudTypeMean = 1.0
rtx.atmosphere.cloudDensity = x1.25
rtx.atmosphere.cloudBaseHeightMeters = 800
rtx.atmosphere.cloudDepthMeters = 3500
rtx.atmosphere.cloudWindSpeed = x1.25
rtx.atmosphere.fogHeightFalloffMeters = 600
rtx.atmosphere.nubis3ErosionStrength = 1.0
rtx.atmosphere.cloudBodyBillowSizeKm = 0.8
rtx.atmosphere.cloudBodyBillowGain = 0.8
rtx.atmosphere.cloudCurlStrengthKm = 0.25
rtx.atmosphere.cloudDiffuseSunStrength = 1.0
rtx.atmosphere.cloudLayer2Enable = True
rtx.atmosphere.cloudLayer2CoverageMean = 0.7
rtx.atmosphere.cloudLayer2BaseHeightMeters = -20
rtx.atmosphere.cloudLayer2DepthMeters = 200
rtx.atmosphere.cloudLayer2TypeMean = 0.0
rtx.atmosphere.cloudLayer2DensityScale = 0.15
rtx.atmosphere.aerosolDensity = x1.4

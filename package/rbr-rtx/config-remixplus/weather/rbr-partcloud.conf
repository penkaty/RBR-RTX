# RBR-RTX: cloud cover PartCloud (NUMOS's Fair: small fair-weather cumulus). Fog: the proxy, not this preset.
weather.bindings = PartCloud
weather.transitionSeconds = 2
weather.enabled = true

rtx.atmosphere.cloudCoverageMean = 0.3
rtx.atmosphere.cloudTypeMean = 0.8
rtx.atmosphere.cloudBaseHeightMeters = 1200
rtx.atmosphere.cloudDepthMeters = 1200
rtx.atmosphere.aerosolDensity = x0.82

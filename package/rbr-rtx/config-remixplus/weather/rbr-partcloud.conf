# NUMOS weather preset "rbr-partcloud". Edit it here or in the Remix dev menu (Sky > Weather > Weather Presets).
# While it shows, exactly the settings listed below override the user's; any rtx.atmosphere.* key may appear.
# A value written x<value> multiplies the user's own setting (per channel for colours).
# weather.bindings: the game weather ids it stands for (rtx.weather.gameWeather), comma separated.
weather.bindings = PartCloud
weather.transitionSeconds = 2

rtx.atmosphere.cloudBaseHeightMeters = 1540
rtx.atmosphere.cloudDepthMeters = 2070
rtx.atmosphere.aerosolDensity = x0.82
rtx.atmosphere.cloudTypeMean = 0.66
rtx.atmosphere.cloudCoverageMean = 0.37

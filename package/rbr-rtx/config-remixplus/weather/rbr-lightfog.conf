# RBR-RTX: sky type LightFog (NUMOS's Fog clouds: a low stratus deck, without its own fog and ground bank). Fog: the
# proxy (the stage's own fog), not this preset.
weather.bindings = LightFog
weather.transitionSeconds = 2
weather.enabled = true

rtx.atmosphere.cloudCoverageMean = 0.75
rtx.atmosphere.cloudTypeMean = 0.0
rtx.atmosphere.cloudTypeSpread = 0.1
rtx.atmosphere.cloudBaseHeightMeters = 400
rtx.atmosphere.cloudDepthMeters = 800
rtx.atmosphere.cloudWindSpeed = x0.3
rtx.atmosphere.fogHeightFalloffMeters = 150
rtx.atmosphere.aerosolDensity = x2.3

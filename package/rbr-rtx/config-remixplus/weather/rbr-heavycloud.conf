# NUMOS weather preset "rbr-heavycloud". Edit it here or in the Remix dev menu (Sky > Weather > Weather Presets).
# While it shows, exactly the settings listed below override the user's; any rtx.atmosphere.* key may appear.
# A value written x<value> multiplies the user's own setting (per channel for colours).
# weather.bindings: the game weather ids it stands for (rtx.weather.gameWeather), comma separated.
weather.bindings = NoRain, HeavyCloud
weather.transitionSeconds = 2

rtx.atmosphere.cloudBaseHeightMeters = 800
rtx.atmosphere.cloudDepthMeters = 1800
rtx.atmosphere.cloudLayer2BaseHeightMeters = 600
rtx.atmosphere.cloudLayer2DepthMeters = 200
rtx.atmosphere.fogHeightFalloffMeters = 600
rtx.atmosphere.aerosolDensity = x1.1
rtx.atmosphere.cloudTypeMean = 1
rtx.atmosphere.cloudCoverageMean = 0.6
rtx.atmosphere.nubis3ErosionStrength = 2
rtx.atmosphere.cloudBodyBillowSizeKm = 1.6
rtx.atmosphere.cloudCurlStrengthKm = 0.74
rtx.atmosphere.cloudDiffuseSunStrength = 1
rtx.atmosphere.cloudBodyBillowGain = 0.8
rtx.atmosphere.cloudLayer2Enable = False
rtx.atmosphere.cloudLayer2TypeMean = 0
rtx.atmosphere.cloudLayer2CoverageMean = 0.85
rtx.atmosphere.cloudLayer2DensityScale = 0.2

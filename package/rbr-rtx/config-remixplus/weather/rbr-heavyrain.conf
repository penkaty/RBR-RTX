# RBR-RTX: sky type HeavyRain (NUMOS's Storm sky without lightning: dense, deep cloud under a grey sheet). Fog: the
# proxy (the stage's own fog), not this preset. Lightning: set lightningStrikesPerMinute here (NUMOS's Storm uses 6).
weather.bindings = HeavyRain
weather.transitionSeconds = 2
weather.enabled = true

rtx.atmosphere.cloudCoverageMean = 0.65
rtx.atmosphere.cloudTypeMean = 1.0
rtx.atmosphere.cloudDensity = x1.5
rtx.atmosphere.cloudBaseHeightMeters = 700
rtx.atmosphere.cloudDepthMeters = 4000
rtx.atmosphere.cloudWindSpeed = x1.75
rtx.atmosphere.fogHeightFalloffMeters = 600
rtx.atmosphere.nubis3ErosionStrength = 1.0
rtx.atmosphere.cloudBodyBillowSizeKm = 0.8
rtx.atmosphere.cloudBodyBillowGain = 0.8
rtx.atmosphere.cloudCurlStrengthKm = 0.25
rtx.atmosphere.cloudDiffuseSunStrength = 1.0
rtx.atmosphere.cloudLayer2Enable = False
rtx.atmosphere.cloudLayer2CoverageMean = 0.85
rtx.atmosphere.cloudLayer2BaseHeightMeters = -20
rtx.atmosphere.cloudLayer2DepthMeters = 300
rtx.atmosphere.cloudLayer2TypeMean = 0.0
rtx.atmosphere.cloudLayer2DensityScale = 0.3
rtx.atmosphere.lightningStrikesPerMinute = 3
rtx.atmosphere.aerosolDensity = x1.8

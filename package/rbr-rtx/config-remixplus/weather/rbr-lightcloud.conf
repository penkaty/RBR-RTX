# RBR-RTX: cloud cover LightCloud (between NUMOS's PartlyCloudy and Cloudy). Fog: the proxy, not this preset.
weather.bindings = LightCloud
weather.transitionSeconds = 2
weather.enabled = true

# 2026-10-30: was 0.52 (user: less cloud in good weather)
rtx.atmosphere.cloudCoverageMean = 0.35
rtx.atmosphere.cloudTypeMean = 0.6
rtx.atmosphere.cloudBaseHeightMeters = 1250
rtx.atmosphere.cloudDepthMeters = 2200
rtx.atmosphere.aerosolDensity = x1.0

# NUMOS weather preset "rbr-lightcloud". Edit it here or in the Remix dev menu (Sky > Weather > Weather Presets).
# While it shows, exactly the settings listed below override the user's; any rtx.atmosphere.* key may appear.
# A value written x<value> multiplies the user's own setting (per channel for colours).
# weather.bindings: the game weather ids it stands for (rtx.weather.gameWeather), comma separated.
weather.bindings = LightCloud
weather.transitionSeconds = 2

rtx.atmosphere.cloudBaseHeightMeters = 1800
rtx.atmosphere.cloudDepthMeters = 730
rtx.atmosphere.aerosolDensity = x1
rtx.atmosphere.cloudTypeMean = 0.8
rtx.atmosphere.cloudCoverageMean = 0.2
rtx.atmosphere.cloudLayer2Enable = False

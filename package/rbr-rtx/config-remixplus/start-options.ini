# RBR-RTX: Remix options the game really runs with (sent at start, win over user.conf and Remix's presets, never saved).
# Remix rewrites these in the Alt+X User Settings at every start when Ray Reconstruction is on, so they are set here instead.
# Changing them in Alt+X has no effect while they are listed here; delete a line to give it back to Alt+X.
rtx.di.enableBestLightSampling = True
rtx.di.enableDenoiserConfidence = True
rtx.di.enableSampleStealing = True
rtx.di.initialSampleCount = 2
rtx.di.stealBoundaryPixelSamplesWhenOutsideOfScreen = True
rtx.neeCache.enableModeAfterFirstBounce = 1
rtx.russianRouletteMode = 0
rtx.sharc.updateTileSize = 8
rtx.sharc.updatePrimaryVertex = True

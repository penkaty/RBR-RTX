; RBR-RTX stage sweep (Remix Plus 2 / rbrkim runtime; the 1.5.2 one is config\sweep.ini): press Alt+K (keys.ini) on a stage, then do not touch anything for about 25 seconds (a beep says it is done): keep the car
; still (handbrake, or pause the clock with the RSF "pause" if you have it), no camera change, no Alt+X menu. Alt+K
; again aborts. With the perf bisect below it takes about 90 seconds. Everything is written to rbr-rtx\logs\sweep-<date>-<time>\ (dev launcher: the run's log folder):
;   stage.txt     stage, country, surface, weather, time of day, camera, sun, proxy modes, atmosphere
;   summary.txt   one line per step: frame time, fps, draws hidden, screenshot file, mean brightness
;   draws.tsv     every draw of one frame: shader, fate, prims, distance, alpha/blend states, textures + Remix hashes
;   textures.tsv  the unique textures of that frame with their Remix hash (for rtx.conf texture lists and mods)
;   NN-*.png      one screenshot per step (the scene taken apart layer by layer, then Remix's debug views)
; Send the whole sweep folder with a bug report. Run it windowed or borderless: in exclusive full screen the
; screenshots come out black (the summary says so).
;
; Format = experiments.ini (key Alt+P): every step starts from [baseline], then sets its own values. Extra keys here:
;   shot = 1 screenshot (here: every step, [run] shots = 1), dump = 1 draw list, capture = 1 Remix USD capture,
;   sun = 0 Remix sun off, skip = shader name parts to hide, ff = fixed-function scenery mode.
; Remix debug view numbers: dxvk-remix src/dxvk/shaders/rtx/utility/debug_view_indices.h.

[run]
; 0.5 s per step: 0.35 s for the denoiser to settle after a change, 0.15 s (at least 10 frames) measured
settle_seconds = 0.35
measure_seconds = 0.15
shots = 1
; [baseline] is only used to put options back after a step (nothing is sent when the sweep starts)
apply_baseline = 0

[baseline]
rtx.debugView.debugViewIdx = 0
rtx.enableReplacementAssets = True
rtx.captureShowMenuOnHotkey = True
rtx.captureHotKey = CTRL, SHIFT, Q

; Remix Plus values of the options the perf bisect switches (= config-remixplus\rtx.conf or the runtime default)
rtx.displacement.mode = 3
rtx.enableReplacementMaterials = True
rtx.enableReplacementMeshes = True
rtx.opacityMicromap.enable = True
rtx.opacityMicromap.building.numFramesAtStartToBuildWithHighWorkload = 1000
rtx.enableSecondaryBounces = True
rtx.neeCache.enable = True
rtx.psrrMaxBounces = 4
rtx.pstrMaxBounces = 4
rtx.integrateIndirectMode = 3
rtx.atmosphere.cloudPerformancePreset = 1
rtx.volumetrics.enableAtmosphere = True
rtx.qualityDLSS = 1
rtx.opacityMicromap.buildRequests.enableAnimatedInstances = True
rtx.compactStableBlas = True
rtx.preferFastTraceForStaticBlas = True
rtx.preferFastTraceForStaticMergedBlas = True

; ---- the scene as you see it, then taken apart layer by layer
[step01]
name = full scene
dump = 1

[step02]
name = without sky
skip = SkyDome,Clouds

[step03]
name = without sky and particles
skip = SkyDome,Clouds,Particle

[step04]
name = without foliage (swaying trees, grass, flags)
skip = SkyDome,Clouds,Particle,Sway

[step05]
name = without objects (IO, ObjPos)
skip = SkyDome,Clouds,Particle,Sway,IO,ObjPos

[step06]
name = without car
skip = SkyDome,Clouds,Particle,Sway,IO,ObjPos,Car,GhostCar

[step07]
name = ground and road only (no water)
skip = SkyDome,Clouds,Particle,Sway,IO,ObjPos,Car,GhostCar,Water

[step08]
name = sun off (sky light only)
sun = 0

; ---- what Remix sees: debug views of the full scene
[step09]
name = view albedo
rtx.debugView.debugViewIdx = 23

[step10]
name = view shading normals
rtx.debugView.debugViewIdx = 16

[step11]
name = view triangle normals (facets = geometry)
rtx.debugView.debugViewIdx = 14

[step12]
name = view roughness
rtx.debugView.debugViewIdx = 25

[step13]
name = view material type
rtx.debugView.debugViewIdx = 22

[step14]
name = view emissive
rtx.debugView.debugViewIdx = 30

[step15]
name = view texture coordinates
rtx.debugView.debugViewIdx = 12

[step16]
name = view vertex colour (baked light)
rtx.debugView.debugViewIdx = 18

[step17]
name = view static geometry (FF scenery)
rtx.debugView.debugViewIdx = 4

[step18]
name = view opacity
rtx.debugView.debugViewIdx = 29

[step19]
name = view primary ray interactions (cost)
rtx.debugView.debugViewIdx = 60

[step20]
name = view direct light
rtx.debugView.debugViewIdx = 155

[step21]
name = view indirect light
rtx.debugView.debugViewIdx = 156

; ---- perf bisect (2026-11-01, overnight plan P1): one suspect off per step, everything back afterwards. Each step
; settles 1.5 s (denoiser, caches) and measures 1 s. summary.txt ends with a ranked table: saving = the last
; "perf reference" step's ms minus the step's ms (positive = that suspect costs this much). The reference is taken
; twice (start, middle) so drift shows. proxy.<switch>: dirt (car dirt pass), glass (windscreen), litparts (lit car
; part twins), precip (Remix rain/drops, normally stopped during a sweep).
[perf00]
name = perf reference (full scene)
settle_seconds = 1.5
measure_seconds = 1.0
ref = 1

[perf01]
name = perf: displacement off (POM/SCCR on height maps)
settle_seconds = 1.5
measure_seconds = 1.0
rtx.displacement.mode = 0

[perf02]
name = perf: displacement raymarch POM instead of SCCR
settle_seconds = 1.5
measure_seconds = 1.0
rtx.displacement.mode = 1

[perf03]
name = perf: replacement materials off (PBR mods)
settle_seconds = 1.5
measure_seconds = 1.0
rtx.enableReplacementMaterials = False

[perf04]
name = perf: replacement meshes off
settle_seconds = 1.5
measure_seconds = 1.0
rtx.enableReplacementMeshes = False

[perf05]
name = perf: car hidden
settle_seconds = 1.5
measure_seconds = 1.0
skip = Car,GhostCar

[perf06]
name = perf: car dirt pass off
settle_seconds = 1.5
measure_seconds = 1.0
proxy.dirt = 0

[perf07]
name = perf: lit car part twins off
settle_seconds = 1.5
measure_seconds = 1.0
proxy.litparts = 0

[perf08]
name = perf: windscreen glass off
settle_seconds = 1.5
measure_seconds = 1.0
proxy.glass = 0

[perf09]
name = perf: car extras off (dirt, twins, glass)
settle_seconds = 1.5
measure_seconds = 1.0
proxy.dirt = 0
proxy.litparts = 0
proxy.glass = 0

[perf10]
name = perf: opacity micromaps off
settle_seconds = 1.5
measure_seconds = 1.0
rtx.opacityMicromap.enable = False

[perf11]
name = perf: OMM start-up build budget normal
settle_seconds = 1.5
measure_seconds = 1.0
rtx.opacityMicromap.building.numFramesAtStartToBuildWithHighWorkload = 0

[perf11a]
name = perf: no OMMs on animated instances (BLAS refit allowed)
settle_seconds = 1.5
measure_seconds = 1.0
rtx.opacityMicromap.buildRequests.enableAnimatedInstances = False

[perf11b]
name = perf: no compaction of stable BLAS
settle_seconds = 1.5
measure_seconds = 1.0
rtx.compactStableBlas = False

[perf11c]
name = perf: no fast-trace static BLAS (refit allowed)
settle_seconds = 1.5
measure_seconds = 1.0
rtx.preferFastTraceForStaticBlas = False
rtx.preferFastTraceForStaticMergedBlas = False

[perf11d]
name = perf: all three BLAS refit blockers off
settle_seconds = 1.5
measure_seconds = 1.0
rtx.opacityMicromap.buildRequests.enableAnimatedInstances = False
rtx.compactStableBlas = False
rtx.preferFastTraceForStaticBlas = False
rtx.preferFastTraceForStaticMergedBlas = False

[perf12]
name = perf reference again (drift)
settle_seconds = 1.5
measure_seconds = 1.0
ref = 1

[perf13]
name = perf: secondary bounces off
settle_seconds = 1.5
measure_seconds = 1.0
rtx.enableSecondaryBounces = False

[perf14]
name = perf: NEE cache off
settle_seconds = 1.5
measure_seconds = 1.0
rtx.neeCache.enable = False

[perf15]
name = perf: reflection/transmission bounces 4 -> 2
settle_seconds = 1.5
measure_seconds = 1.0
rtx.psrrMaxBounces = 2
rtx.pstrMaxBounces = 2

[perf16]
name = perf: indirect ReSTIR GI instead of SHaRC
settle_seconds = 1.5
measure_seconds = 1.0
rtx.integrateIndirectMode = 1

[perf17]
name = perf: NUMOS clouds preset 0
settle_seconds = 1.5
measure_seconds = 1.0
rtx.atmosphere.cloudPerformancePreset = 0

[perf18]
name = perf: NUMOS clouds preset 2
settle_seconds = 1.5
measure_seconds = 1.0
rtx.atmosphere.cloudPerformancePreset = 2

[perf19]
name = perf: volumetric atmosphere off
settle_seconds = 1.5
measure_seconds = 1.0
rtx.volumetrics.enableAtmosphere = False

[perf20]
name = perf: sky hidden
settle_seconds = 1.5
measure_seconds = 1.0
skip = SkyDome,Clouds

[perf21]
name = perf: foliage hidden (Sway)
settle_seconds = 1.5
measure_seconds = 1.0
skip = Sway

[perf22]
name = perf: objects hidden (IO, ObjPos)
settle_seconds = 1.5
measure_seconds = 1.0
skip = IO,ObjPos

[perf23]
name = perf: Remix rain/drops ON (negative = their cost; 0 on a dry stage)
settle_seconds = 1.5
measure_seconds = 1.0
proxy.precip = 1

[perf24]
name = perf: DLSS ultra performance
settle_seconds = 1.5
measure_seconds = 1.0
rtx.qualityDLSS = 0

[perf25]
name = perf: all cheap together (no POM, no OMM, no 2nd bounces, bounces 2, car extras off)
settle_seconds = 1.5
measure_seconds = 1.0
rtx.displacement.mode = 0
rtx.opacityMicromap.enable = False
rtx.enableSecondaryBounces = False
rtx.psrrMaxBounces = 2
rtx.pstrMaxBounces = 2
proxy.dirt = 0
proxy.litparts = 0
proxy.glass = 0

; ---- the game's own textures (no PBR mod)
[step22]
name = original textures (replacements off)
rtx.enableReplacementAssets = False

; ---- Remix USD scene capture (rtx-remix\captures; open it in the RTX Remix Toolkit). The sweep presses Pause as a
; real key for this step only (the game window must be in front). The game can stall for a few seconds, that is normal.
[step23]
name = Remix USD capture
rtx.enableReplacementAssets = False
rtx.captureShowMenuOnHotkey = False
rtx.captureHotKey = PAUSE
capture = 1
measure_seconds = 10

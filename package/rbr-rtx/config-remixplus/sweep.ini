; 2026-11-13 17:46 sweep (Peyregrosse, heavy rain): rain off 2.5 ms, car lamps off 2.2, both off 2.6 (not 4.8), and half
; the drops / a 45 m disk / localLightGain 0 save nothing: the cost is rain AND lamps together, not the drop count.
; These four steps log Remix's per-pass GPU times ([PerfGpu] lines in remix-dxvk.log, every 30 frames) so the pass that
